<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- MANDATORY: Declare support for both light and dark themes to prevent FOUC -->
    <meta name="color-scheme" content="light" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#234c3f" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Flow Atelier" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta
      name="description"
      content="매일의 필라테스 수업을 더 편하게. 맞춤 시간 시퀀스, 동작 라이브러리, 수업 기록 — Flow Atelier"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Flow Atelier · 필라테스 수업 플래너</title>
    <script>
      // Self-healing boot watchdog: if a stale cached Service Worker ever serves an incompatible
      // bundle that leaves #root empty after 2.5s, promote any waiting worker (or unregister) once.
      window.addEventListener('DOMContentLoaded', function () {
        setTimeout(function () {
          var root = document.getElementById('root');
          if (root && root.childNodes.length === 0 && 'serviceWorker' in navigator) {
            if (sessionStorage.getItem('pf_sw_recovered_v1')) return;
            sessionStorage.setItem('pf_sw_recovered_v1', '1');
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              Promise.all(
                regs.map(function (reg) {
                  if (reg.waiting) {
                    reg.waiting.postMessage({ type: 'SKIP_WAITING' });
                  }
                  return reg.unregister();
                })
              ).finally(function () {
                window.location.reload();
              });
            });
          }
        }, 2500);
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
