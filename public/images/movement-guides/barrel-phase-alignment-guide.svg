<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-labelledby="barrel-guide-title barrel-guide-desc">
  <title id="barrel-guide-title">바렐 필라테스 3단계 아크 분절 &amp; 흉추 신전 정렬 가이드 (Barrel Phase Alignment &amp; Kinematics Guide)</title>
  <desc id="barrel-guide-desc">Free original authored schematic (anatomicalAccuracyAssumed: false; pre-review vs post-review distinction required). Depicts Start (시작 자세 supported over barrel arc), Middle (중간 정점 자세 thoracic extension / Swan line with start-pose delta ghost), and End (끝 복귀 자세 articulated return to arc) on the Ladder Barrel.</desc>
  <defs>
    <marker id="arrow-excursion" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#9a502d" />
    </marker>
    <marker id="arrow-return" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#244d44" />
    </marker>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbfaf5" />
      <stop offset="100%" stop-color="#f2ede1" />
    </linearGradient>
    <radialGradient id="muscle-barrel" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c17c52" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#c17c52" stop-opacity="0.08" />
    </radialGradient>
  </defs>

  <rect width="960" height="360" rx="16" fill="url(#bg-grad)" stroke="#d9d1c1" stroke-width="1.5" />

  <!-- Top Editorial Banner -->
  <g font-family="Pretendard, -apple-system, BlinkMacSystemFont, sans-serif">
    <text x="24" y="27" font-size="13" font-weight="700" fill="#244d44">BARREL · 래더 바렐 아크 밀착 &amp; 흉추 신전(Swan) 3단계 관절 정렬 도해</text>
    <text x="936" y="27" text-anchor="end" font-size="10.5" font-weight="600" fill="#875641">FREE ORIGINAL SVG · 해부학적 확정 가정 없음 (anatomicalAccuracyAssumed: false)</text>
  </g>

  <!-- ==================== PANEL 1: START (x: 20..310) ==================== -->
  <g id="phase-start">
    <rect x="20" y="38" width="290" height="278" rx="12" fill="#ffffff" fill-opacity="0.78" stroke="#d8cfc0" stroke-width="1.2" />
    <rect x="32" y="48" width="118" height="22" rx="6" fill="#244d44" />
    <text x="91" y="63" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="11" font-weight="700" fill="#fbfaf5">1. START · 시작 자세</text>
    <text x="298" y="63" text-anchor="end" font-family="Pretendard, sans-serif" font-size="10" fill="#5e6761">래더 고정 · 바렐 아크 이완</text>

    <!-- Ladder Rungs (Right) & Barrel Curved Arc (Left-Center) -->
    <line x1="266" y1="112" x2="266" y2="256" stroke="#244d44" stroke-width="4" />
    <circle cx="266" cy="160" r="4" fill="#6b826d" />
    <circle cx="266" cy="196" r="4" fill="#6b826d" />
    <circle cx="266" cy="232" r="5" fill="#9a502d" />
    <!-- Barrel Arc -->
    <path d="M 78 256 L 78 208 Q 134 152 190 208 L 190 256 Z" fill="#e6dec8" stroke="#244d44" stroke-width="1.8" />

    <!-- Joint Alignment Axis (Pelvis Apex Anchor & Rung Line) -->
    <line x1="154" y1="98" x2="154" y2="256" stroke="#6b826d" stroke-width="1.3" stroke-dasharray="4 3" />
    <text x="154" y="90" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="9.5" font-weight="600" fill="#244d44">바렐 정점 치골·ASIS 지지축</text>

    <!-- Primary Muscle Pre-activation (Glutes & Deep Core Support) -->
    <ellipse cx="164" cy="184" rx="24" ry="12" fill="url(#muscle-barrel)" stroke="#c17c52" stroke-width="1" stroke-dasharray="3 2" />
    <text x="214" y="138" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="9.5" font-weight="700" fill="#9a502d">둔근·하지 앵커 예열</text>

    <!-- Right Limb (Dashed) -->
    <g stroke="#875641" stroke-width="3.2" stroke-dasharray="6 4" stroke-linecap="round" fill="none">
      <path d="M 158 180 L 266 228" />
    </g>
    <!-- Left Limb & Draped Torso over Barrel (Solid) -->
    <g stroke="#244d44" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- Torso draped over barrel curve -->
      <path d="M 90 198 Q 124 166 154 180" />
      <!-- Left Leg anchored to Ladder Rung -->
      <path d="M 154 180 L 210 206 L 266 232" />
      <!-- Left Arm forward along arc -->
      <path d="M 102 188 L 66 208" />
    </g>
    <circle cx="78" cy="206" r="10" fill="#e6dec8" stroke="#244d44" stroke-width="2.5" />
    <circle cx="154" cy="180" r="4.5" fill="#fbfaf5" stroke="#244d44" stroke-width="2" />
    <circle cx="266" cy="232" r="4.5" fill="#9a502d" />

    <text x="165" y="288" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="9.5" font-weight="600" fill="#244d44">래더 발판 지지 &amp; 복부 아크 밀착</text>
  </g>

  <!-- ==================== PANEL 2: MIDDLE (x: 335..625) ==================== -->
  <g id="phase-middle">
    <rect x="335" y="38" width="290" height="278" rx="12" fill="#ffffff" fill-opacity="0.9" stroke="#c17c52" stroke-width="1.6" />
    <rect x="347" y="48" width="138" height="22" rx="6" fill="#9a502d" />
    <text x="416" y="63" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="11" font-weight="700" fill="#fbfaf5">2. MIDDLE · 중간 정점 자세</text>
    <text x="613" y="63" text-anchor="end" font-family="Pretendard, sans-serif" font-size="10" fill="#9a502d">흉추 아치 신전 · 사선 일직선</text>

    <!-- Ladder Rungs & Barrel Curved Arc -->
    <line x1="581" y1="112" x2="581" y2="256" stroke="#244d44" stroke-width="4" />
    <circle cx="581" cy="160" r="4" fill="#6b826d" />
    <circle cx="581" cy="196" r="4" fill="#6b826d" />
    <circle cx="581" cy="232" r="5.5" fill="#9a502d" />
    <path d="M 393 256 L 393 208 Q 449 152 505 208 L 505 256 Z" fill="#e6dec8" stroke="#244d44" stroke-width="1.8" />

    <!-- GHOSTED START-POSE SILHOUETTE (Shows Draped vs Thoracic Extension Delta) -->
    <g id="middle-start-ghost" opacity="0.22" stroke="#244d44" stroke-width="3" stroke-dasharray="3 3" fill="none">
      <circle cx="393" cy="206" r="10" />
      <path d="M 405 198 Q 439 166 469 180" />
    </g>
    <text x="480" y="274" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="9" fill="#5e6761">점선 실루엣: 아크 이완 자세 대비 상체 신전 각도 변위</text>

    <!-- Joint Alignment Long Diagonal Line (Crown - Spine - Hip - Ankle) -->
    <line x1="382" y1="132" x2="581" y2="232" stroke="#6b826d" stroke-width="1.4" stroke-dasharray="5 3" />
    <text x="476" y="102" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="9.5" font-weight="600" fill="#244d44">요추 꺾임 없는 정수리-골반-발목 사선 정렬</text>

    <!-- Primary Muscle Zones (Thoracic Extensors, Glutes, Abdominal Support) -->
    <ellipse cx="436" cy="158" rx="30" ry="13" transform="rotate(26 436 158)" fill="url(#muscle-barrel)" stroke="#9a502d" stroke-width="1.2" />
    <ellipse cx="504" cy="196" rx="28" ry="11" transform="rotate(26 504 196)" fill="url(#muscle-barrel)" stroke="#9a502d" stroke-width="1" />
    <text x="488" y="132" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="9.5" font-weight="700" fill="#9a502d">주요 근육: 흉추 기립근 · 둔근 · 복벽 지지</text>

    <!-- Right Limb (Dashed) -->
    <g stroke="#875641" stroke-width="3.2" stroke-dasharray="6 4" stroke-linecap="round" fill="none">
      <path d="M 473 178 L 581 228" />
      <path d="M 418 148 L 372 126" />
    </g>
    <!-- Left Limb & Extended Torso (Solid) -->
    <g stroke="#244d44" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 404 144 L 469 180" />
      <path d="M 469 180 L 525 206 L 581 232" />
      <path d="M 414 150 L 368 128" />
    </g>
    <circle cx="390" cy="134" r="10.5" fill="#e6dec8" stroke="#244d44" stroke-width="2.5" />
    <circle cx="469" cy="180" r="4.5" fill="#fbfaf5" stroke="#244d44" stroke-width="2" />
    <circle cx="581" cy="232" r="4.5" fill="#9a502d" />

    <!-- Movement Direction Vector (Thoracic Lift & Axial Reach) -->
    <path d="M 366 196 Q 358 164 374 142" fill="none" stroke="#9a502d" stroke-width="2.4" marker-end="url(#arrow-excursion)" />
    <text x="480" y="292" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="9.5" font-weight="700" fill="#9a502d">들숨/날숨 연결: 흉골 전상방 신장 (Thoracic Extension)</text>
  </g>

  <!-- ==================== PANEL 3: END (x: 650..940) ==================== -->
  <g id="phase-end">
    <rect x="650" y="38" width="290" height="278" rx="12" fill="#ffffff" fill-opacity="0.78" stroke="#d8cfc0" stroke-width="1.2" />
    <rect x="662" y="48" width="128" height="22" rx="6" fill="#244d44" />
    <text x="726" y="63" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="11" font-weight="700" fill="#fbfaf5">3. END · 끝 복귀 자세</text>
    <text x="928" y="63" text-anchor="end" font-family="Pretendard, sans-serif" font-size="10" fill="#5e6761">아크 곡면 따라 순차 하강</text>

    <!-- Ladder Rungs & Barrel Curved Arc -->
    <line x1="896" y1="112" x2="896" y2="256" stroke="#244d44" stroke-width="4" />
    <circle cx="896" cy="160" r="4" fill="#6b826d" />
    <circle cx="896" cy="196" r="4" fill="#6b826d" />
    <circle cx="896" cy="232" r="5" fill="#244d44" />
    <path d="M 708 256 L 708 208 Q 764 152 820 208 L 820 256 Z" fill="#e6dec8" stroke="#244d44" stroke-width="1.8" />

    <!-- Joint Alignment Axis -->
    <line x1="784" y1="98" x2="784" y2="256" stroke="#6b826d" stroke-width="1.3" stroke-dasharray="4 3" />
    <text x="784" y="90" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="9.5" font-weight="600" fill="#244d44">아크 정점 골반 안정 유지</text>

    <!-- Primary Muscle Highlight -->
    <ellipse cx="754" cy="176" rx="28" ry="12" fill="url(#muscle-barrel)" stroke="#c17c52" stroke-width="1" />
    <text x="838" y="138" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="9.5" font-weight="700" fill="#9a502d">복부·기립근 원심성 감속</text>

    <!-- Right Limb (Dashed) -->
    <g stroke="#875641" stroke-width="3.2" stroke-dasharray="6 4" stroke-linecap="round" fill="none">
      <path d="M 788 180 L 896 228" />
    </g>
    <!-- Left Limb & Torso (Solid) -->
    <g stroke="#244d44" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 720 198 Q 754 166 784 180" />
      <path d="M 784 180 L 840 206 L 896 232" />
      <path d="M 732 188 L 696 208" />
    </g>
    <circle cx="708" cy="206" r="10" fill="#e6dec8" stroke="#244d44" stroke-width="2.5" />
    <circle cx="784" cy="180" r="4.5" fill="#fbfaf5" stroke="#244d44" stroke-width="2" />
    <circle cx="896" cy="232" r="4.5" fill="#244d44" />

    <!-- Return Vector -->
    <path d="M 706 144 Q 686 168 696 194" fill="none" stroke="#244d44" stroke-width="2.2" marker-end="url(#arrow-return)" />
    <text x="795" y="288" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="9.5" font-weight="700" fill="#244d44">아랫배부터 바렐 곡면에 순차 안착 복귀</text>
  </g>

  <!-- ==================== BOTTOM LEGEND BAR ==================== -->
  <g transform="translate(20, 324)" font-family="Pretendard, sans-serif" font-size="10" fill="#244d44">
    <line x1="6" y1="12" x2="28" y2="12" stroke="#244d44" stroke-width="3.5" stroke-linecap="round" />
    <text x="34" y="16" font-weight="600">좌측 사지 (실선)</text>

    <line x1="124" y1="12" x2="146" y2="12" stroke="#875641" stroke-width="3" stroke-dasharray="5 3" stroke-linecap="round" />
    <text x="152" y="16" font-weight="600" fill="#875641">우측 사지 (점선)</text>

    <line x1="244" y1="12" x2="266" y2="12" stroke="#6b826d" stroke-width="1.5" stroke-dasharray="4 3" />
    <circle cx="255" cy="12" r="3.5" fill="#9a502d" />
    <text x="272" y="16" font-weight="600">관절 정렬축 · 래더 앵커</text>

    <line x1="396" y1="12" x2="418" y2="12" stroke="#9a502d" stroke-width="2" marker-end="url(#arrow-excursion)" />
    <text x="426" y="16" font-weight="600" fill="#9a502d">움직임 방향 (신전/복귀)</text>

    <ellipse cx="564" cy="12" rx="10" ry="6" fill="#c17c52" fill-opacity="0.45" stroke="#9a502d" stroke-width="1" />
    <text x="580" y="16" font-weight="600" fill="#9a502d">주요 작용 근육 영역</text>

    <text x="920" y="16" text-anchor="end" font-size="9.5" fill="#5e6761">※ 교육용 개념 도해이며 의료·임상 진단을 대체하지 않습니다</text>
  </g>
</svg>
