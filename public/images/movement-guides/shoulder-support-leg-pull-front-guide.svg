<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-labelledby="lpf-guide-title lpf-guide-desc" data-movement-id="shoulder-support-leg-pull-front" data-anatomical-accuracy-assumed="false">
  <title id="lpf-guide-title">레그 풀 프런트 3단계 견갑 수직 지지 및 단측 고관절 신전 가이드 (Leg Pull Front Alignment &amp; Kinematics Guide)</title>
  <desc id="lpf-guide-desc">Free original authored 2D kinematic schematic (MIT License, anatomicalAccuracyAssumed: false, professionalReviewCount: 0, sourceFrameMappings: 0). Depicts Start (프런트 서포트 수직 지지 및 양발 플랭크), Middle (골반 수평·요추 중립 고정 하 단측 고관절 18.5° 신전 리치), and End (골반 흔들림 없는 양발 플랭크 복귀) with wrist-vertical-support, scapula-thoracic-support, and shoulder-pelvis-ankle-plank-line alignment guides.</desc>
  <defs>
    <marker id="arrow-excursion" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#9a502d" />
    </marker>
    <marker id="arrow-return" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#244d44" />
    </marker>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbfaf5" />
      <stop offset="100%" stop-color="#f2ede1" />
    </linearGradient>
    <radialGradient id="muscle-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c17c52" stop-opacity="0.48" />
      <stop offset="100%" stop-color="#c17c52" stop-opacity="0.08" />
    </radialGradient>
  </defs>

  <rect width="960" height="360" rx="16" fill="url(#bg-grad)" stroke="#d9d1c1" stroke-width="1.5" />

  <g font-family="Pretendard, -apple-system, BlinkMacSystemFont, sans-serif">
    <text x="24" y="27" font-size="13" font-weight="700" fill="#244d44">SHOULDER SUPPORT · 레그 풀 프런트 (견갑 수직 지지 &amp; 단측 고관절 18.5° 신전) 3단계 정렬 도해</text>
    <text x="936" y="27" text-anchor="end" font-size="10.5" font-weight="600" fill="#875641">ORIGINAL MIT SVG · 해부학적 확정 가정 없음 (anatomicalAccuracyAssumed: false)</text>
  </g>

  <!-- ==================== PANEL 1: START (x: 20..310) ==================== -->
  <g id="phase-start" data-phase="start">
    <rect x="20" y="38" width="290" height="278" rx="12" fill="#ffffff" fill-opacity="0.82" stroke="#d8cfc0" stroke-width="1.2" />
    <rect x="32" y="48" width="118" height="22" rx="6" fill="#244d44" />
    <text x="91" y="63" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="11" font-weight="700" fill="#fbfaf5">1. START · 시작 자세</text>
    <text x="298" y="63" text-anchor="end" font-family="Pretendard, sans-serif" font-size="10" fill="#5e6761">프런트 서포트 세팅</text>

    <rect x="38" y="252" width="254" height="8" rx="4" fill="#6b826d" fill-opacity="0.35" stroke="#244d44" stroke-width="1" />

    <!-- 3 Support Alignment Lines -->
    <line data-support-line="wrist-vertical-support" x1="88" y1="120" x2="88" y2="252" stroke="#2b6a58" stroke-width="1.5" stroke-dasharray="4 3" />
    <line data-support-line="scapula-thoracic-support" x1="88" y1="148" x2="124" y2="160" stroke="#9a502d" stroke-width="2.2" />
    <line data-support-line="shoulder-pelvis-ankle-plank-line" x1="68" y1="141" x2="264" y2="211" stroke="#6b826d" stroke-width="1.5" stroke-dasharray="5 3" />

    <ellipse cx="108" cy="160" rx="22" ry="12" fill="url(#muscle-core)" stroke="#c17c52" stroke-width="1" />

    <g stroke="#244d44" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 68 141 L 88 148 L 160 174 L 212 193 L 264 211" />
      <path d="M 88 148 L 88 198 L 88 248 L 76 250" />
      <path d="M 264 211 L 260 250" />
    </g>
    <circle cx="58" cy="137" r="10" fill="#e6dec8" stroke="#244d44" stroke-width="2.4" />
    <circle cx="88" cy="148" r="4" fill="#fbfaf5" stroke="#244d44" stroke-width="2" />
    <circle cx="88" cy="248" r="4.5" fill="#9a502d" />
    <circle cx="160" cy="174" r="4" fill="#fbfaf5" stroke="#244d44" stroke-width="2" />
    <circle cx="264" cy="211" r="3.5" fill="#fbfaf5" stroke="#244d44" stroke-width="2" />
    <text x="165" y="290" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="9.5" font-weight="600" fill="#244d44">손목-어깨 수직 스택 &amp; 양발 지지 플랭크</text>
  </g>

  <!-- ==================== PANEL 2: MIDDLE (x: 335..625) ==================== -->
  <g id="phase-middle" data-phase="middle">
    <rect x="335" y="38" width="290" height="278" rx="12" fill="#ffffff" fill-opacity="0.92" stroke="#c17c52" stroke-width="1.6" />
    <rect x="347" y="48" width="138" height="22" rx="6" fill="#9a502d" />
    <text x="416" y="63" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="11" font-weight="700" fill="#fbfaf5">2. MIDDLE · 중간 정점 자세</text>
    <text x="613" y="63" text-anchor="end" font-family="Pretendard, sans-serif" font-size="10" fill="#9a502d">단측 고관절 18.5° 신전</text>

    <rect x="353" y="252" width="254" height="8" rx="4" fill="#6b826d" fill-opacity="0.35" stroke="#244d44" stroke-width="1" />

    <!-- 3 Support Alignment Lines -->
    <line data-support-line="wrist-vertical-support" x1="403" y1="120" x2="403" y2="252" stroke="#2b6a58" stroke-width="1.5" stroke-dasharray="4 3" />
    <line data-support-line="scapula-thoracic-support" x1="403" y1="148" x2="439" y2="160" stroke="#9a502d" stroke-width="2.2" />
    <line data-support-line="shoulder-pelvis-ankle-plank-line" x1="383" y1="141" x2="579" y2="211" stroke="#6b826d" stroke-width="1.5" stroke-dasharray="5 3" />

    <!-- Muscle Highlight: Glute Max & Hamstrings + Core -->
    <ellipse cx="488" cy="174" rx="26" ry="12" fill="url(#muscle-core)" stroke="#9a502d" stroke-width="1.2" />
    <ellipse cx="422" cy="158" rx="20" ry="11" fill="url(#muscle-core)" stroke="#9a502d" stroke-width="1" />

    <!-- Supporting Leg (Dashed) -->
    <g stroke="#875641" stroke-width="3.2" stroke-dasharray="6 4" stroke-linecap="round" fill="none">
      <path d="M 475 174 L 527 193 L 579 211 L 575 250" />
    </g>

    <!-- Trunk, Supporting Arm & Lifted Leg (18.5 deg above plank line) -->
    <g stroke="#244d44" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 383 141 L 403 148 L 475 174" />
      <path d="M 403 148 L 403 198 L 403 248 L 391 250" />
      <path d="M 475 174 L 532 175 L 590 176 L 604 177" />
    </g>
    <circle cx="373" cy="137" r="10" fill="#e6dec8" stroke="#244d44" stroke-width="2.4" />
    <circle cx="403" cy="148" r="4" fill="#fbfaf5" stroke="#244d44" stroke-width="2" />
    <circle cx="403" cy="248" r="4.5" fill="#9a502d" />
    <circle cx="475" cy="174" r="4.5" fill="#fbfaf5" stroke="#9a502d" stroke-width="2" />
    <circle cx="532" cy="175" r="3.5" fill="#fbfaf5" stroke="#244d44" stroke-width="2" />
    <circle cx="590" cy="176" r="3.5" fill="#fbfaf5" stroke="#244d44" stroke-width="2" />

    <line x1="579" y1="208" x2="588" y2="180" stroke="#9a502d" stroke-width="2" marker-end="url(#arrow-excursion)" />
    <text x="480" y="290" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="9.5" font-weight="700" fill="#9a502d">골반 수평 고정(처짐 0) · 한 다리 18.5° 신전 리치</text>
  </g>

  <!-- ==================== PANEL 3: END (x: 650..940) ==================== -->
  <g id="phase-end" data-phase="end">
    <rect x="650" y="38" width="290" height="278" rx="12" fill="#ffffff" fill-opacity="0.82" stroke="#d8cfc0" stroke-width="1.2" />
    <rect x="662" y="48" width="128" height="22" rx="6" fill="#244d44" />
    <text x="726" y="63" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="11" font-weight="700" fill="#fbfaf5">3. END · 끝 복귀 자세</text>
    <text x="928" y="63" text-anchor="end" font-family="Pretendard, sans-serif" font-size="10" fill="#5e6761">양발 플랭크 제어 복귀</text>

    <rect x="668" y="252" width="254" height="8" rx="4" fill="#6b826d" fill-opacity="0.35" stroke="#244d44" stroke-width="1" />

    <!-- 3 Support Alignment Lines -->
    <line data-support-line="wrist-vertical-support" x1="718" y1="120" x2="718" y2="252" stroke="#2b6a58" stroke-width="1.5" stroke-dasharray="4 3" />
    <line data-support-line="scapula-thoracic-support" x1="718" y1="148" x2="754" y2="160" stroke="#9a502d" stroke-width="2.2" />
    <line data-support-line="shoulder-pelvis-ankle-plank-line" x1="698" y1="141" x2="894" y2="211" stroke="#6b826d" stroke-width="1.5" stroke-dasharray="5 3" />

    <g stroke="#244d44" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 698 141 L 718 148 L 790 174 L 842 193 L 894 211" />
      <path d="M 718 148 L 718 198 L 718 248 L 706 250" />
      <path d="M 894 211 L 890 250" />
    </g>
    <circle cx="688" cy="137" r="10" fill="#e6dec8" stroke="#244d44" stroke-width="2.4" />
    <circle cx="718" cy="148" r="4" fill="#fbfaf5" stroke="#244d44" stroke-width="2" />
    <circle cx="718" cy="248" r="4.5" fill="#244d44" />
    <circle cx="790" cy="174" r="4" fill="#fbfaf5" stroke="#244d44" stroke-width="2" />
    <circle cx="894" cy="211" r="3.5" fill="#fbfaf5" stroke="#244d44" stroke-width="2" />

    <line x1="894" y1="180" x2="894" y2="206" stroke="#244d44" stroke-width="2" marker-end="url(#arrow-return)" />
    <text x="795" y="290" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="9.5" font-weight="600" fill="#244d44">허리 흔들림 없이 발볼 매트 지지 복귀</text>
  </g>

  <!-- ==================== BOTTOM LEGEND BAR ==================== -->
  <g transform="translate(20, 324)" font-family="Pretendard, sans-serif" font-size="10" fill="#244d44">
    <line x1="6" y1="12" x2="28" y2="12" stroke="#2b6a58" stroke-width="1.8" stroke-dasharray="4 3" />
    <text x="34" y="16" font-weight="600">손목-견관절 수직 지지선 (wrist-vertical-support)</text>

    <line x1="286" y1="12" x2="308" y2="12" stroke="#9a502d" stroke-width="2.4" />
    <text x="314" y="16" font-weight="600" fill="#9a502d">전거근 견갑 밀착선 (scapula-thoracic-support)</text>

    <line x1="560" y1="12" x2="582" y2="12" stroke="#6b826d" stroke-width="1.8" stroke-dasharray="5 3" />
    <text x="588" y="16" font-weight="600">플랭크 직선축 (shoulder-pelvis-ankle-plank-line)</text>

    <text x="920" y="16" text-anchor="end" font-size="9.5" fill="#5e6761">※ 비의료 교육 참고 도해</text>
  </g>
</svg>
