<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" role="img" aria-labelledby="mpd-title-_R_0_" aria-describedby="mpd-desc-_R_0_" class="movement-phase-diagram-svg" data-exercise-id="original-chair-seated-back-reach" data-phase="middle" data-archetype-id="chair-seated-back-reach-isolated" data-apparatus="chair" data-body-position="seated" data-active-side="right" data-view-mirrored="false" data-production-method="free-authored-kinematic-svg-v1" data-anatomical-accuracy-assumed="false" data-visual-theme="studio" data-material-system="atelier-v2" data-detail-level="preview" style="width:100%;height:auto;display:block;aspect-ratio:8 / 5;border-radius:10px"><title id="mpd-title-_R_0_">체어 시티드 가슴 리치 · 정점 자세 · 계획용 동작 도해</title><desc id="mpd-desc-_R_0_">좌골(132,108)과 요추(132,92)를 안정적으로 지지한 채 흉추(132,74→142,68)와 머리(132,26→142,20)를 앞·위로 길게 뻗어 가슴을 엽니다. (두 발과 좌골을 지지하고 가슴을 앞·위로 조금 길게 보냈다 돌아옵니다.) 호흡 큐: 날숨: 날개뼈를 뒷주머니 쪽으로 끌어내리며 로잉/스트랩 당김. 지지면: 운다 체어 시티드 (앉은 자세). 활성 타겟 근육: 척추기립근·흉추 신전근 (후면 척추)(주동근 (주 타겟)), 삼각근·상완이두/삼두근 (상지 주동)(주동근 (주 타겟)), 심부 코어 (복횡근·다열근·골반저근)(안정화근 (코어·정렬 유지)), 장요근·고관절 굴곡근 (전면 고관절)(신장·이완 부위). 앱 자체 제작 다관절 키네마틱 도해 (Original Free-License Kinematic SVG v1 · 외부 저작권 무관)</desc><defs><linearGradient id="mpd-bg-_R_0_" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="200"><stop offset="0%" stop-color="#faf9f5"></stop><stop offset="68%" stop-color="#f0f1eb"></stop><stop offset="100%" stop-color="#e5e9e1"></stop></linearGradient><linearGradient id="mpd-oak-_R_0_" gradientUnits="userSpaceOnUse" x1="0" y1="100" x2="0" y2="180"><stop offset="0%" stop-color="#ead8b8"></stop><stop offset="48%" stop-color="#cfae82"></stop><stop offset="100%" stop-color="#ac875b"></stop></linearGradient><linearGradient id="mpd-upholstery-_R_0_" x1="0" y1="0" x2="0.2" y2="1"><stop offset="0%" stop-color="#8b9f8c"></stop><stop offset="32%" stop-color="#637e68"></stop><stop offset="100%" stop-color="#405c48"></stop></