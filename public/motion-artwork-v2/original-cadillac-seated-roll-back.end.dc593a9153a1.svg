<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" role="img" aria-labelledby="mpd-title-_R_0_" aria-describedby="mpd-desc-_R_0_" class="movement-phase-diagram-svg" data-exercise-id="original-cadillac-seated-roll-back" data-phase="end" data-archetype-id="seated-roll-back-spine-twist" data-apparatus="cadillac" data-body-position="seated" data-active-side="right" data-view-mirrored="false" data-production-method="free-authored-kinematic-svg-v1" data-anatomical-accuracy-assumed="false" data-visual-theme="studio" data-material-system="atelier-v2" data-detail-level="preview" style="width:100%;height:auto;display:block;aspect-ratio:8 / 5;border-radius:10px"><title id="mpd-title-_R_0_">시티드 롤백 준비 · 마무리 자세 · 계획용 동작 도해</title><desc id="mpd-desc-_R_0_">천골(S1)·요추(L3)·하부흉추(T12)가 차례대로 매트(y=140..143)에 안착하고, 상부 흉추와 경추(T4·C7)까지 원심성 수축으로 감속하며 분절 착지를 마무리합니다. 호흡 큐: 끝까지 내쉬며 척추 마디를 매트에 도장 찍듯 내려놓고 복부 중심을 유지합니다.. 지지면: 필라테스 매트 수평 기준면 (y=144). 활성 타겟 근육: 복직근 · 복사근 (원심성 감속)(주동근 (주 타겟)), 복횡근 · 심부 요추-골반 안정화근(안정화근 (코어·정렬 유지)), 척추기립근 · 요방형근 신장(신장·이완 부위). 앱 자체 제작 2D 키네마틱 도해 (자유 라이선스 · 외부 프레임 무차용)</desc><defs><linearGradient id="mpd-bg-_R_0_" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="200"><stop offset="0%" stop-color="#faf9f5"></stop><stop offset="68%" stop-color="#f0f1eb"></stop><stop offset="100%" stop-color="#e5e9e1"></stop></linearGradient><linearGradient id="mpd-oak-_R_0_" gradientUnits="userSpaceOnUse" x1="0" y1="100" x2="0" y2="180"><stop offset="0%" stop-color="#ead8b8"></stop><stop offset="48%" stop-color="#cfae82"></stop><stop offset="100%" stop-color="#ac875b"></stop></linearGradient><linearGradient id="mpd-upholstery-_R_0_" x1="0" y1="0" x2="0.2" y2="1"><stop offset="0%" stop-color="#8b9f8c"></stop><stop offset="32%" stop-color="#637e68"></stop><stop offset="100%" stop-color="#405c48"></stop></linearGradient><linearGradient id="mpd-torso-_R_0_" x1="0.05" y1="0" x2="0.9" y2="0.9"><stop offset