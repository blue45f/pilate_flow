<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" role="img" aria-labelledby="mpd-title-_R_0_" aria-describedby="mpd-desc-_R_0_" class="movement-phase-diagram-svg" data-exercise-id="original-reformer-side-lying-press" data-phase="middle" data-archetype-id="reformer-side-lying-footbar-press" data-apparatus="reformer" data-body-position="side-lying" data-active-side="right" data-view-mirrored="false" data-production-method="free-authored-kinematic-svg-v1" data-anatomical-accuracy-assumed="false" data-visual-theme="studio" data-material-system="atelier-v2" data-detail-level="preview" style="width:100%;height:auto;display:block;aspect-ratio:8 / 5;border-radius:10px"><title id="mpd-title-_R_0_">사이드 라잉 레그 프레스 · 정점 자세 · 계획용 동작 도해</title><desc id="mpd-desc-_R_0_">머리·몸통·아래쪽 다리는 캐리지와 함께 움직이고 위쪽 발의 풋바 접촉은 유지합니다. 발이 공중으로 벌어지는 외전 그림을 제거합니다. (옆으로 누운 지지와 발의 접촉을 확인하고 캐리지를 작은 범위로 밀었다 돌아옵니다.) 호흡 큐: 날숨: 위쪽 뒤꿈치를 벽 쪽으로 길게 뻗으며 리프트/프레스. 지지면: 리포머 사이드 (옆으로 누운) · 풋바(MID) · 헤드레스트(FLAT). 활성 타겟 근육: 중둔근·외전근군 (측면 골반 지지)(주동근 (주 타겟)), 대둔근 (후면 고관절 신전)(주동근 (주 타겟)), 복직근·내외복사근 (전측면 코어)(안정화근 (코어·정렬 유지)), 내전근군 (하지 중심선 연결)(신장·이완 부위). 앱 자체 제작 다관절 키네마틱 도해 (Original Free-License Kinematic SVG v1 · 외부 저작권 무관)</desc><defs><linearGradient id="mpd-bg-_R_0_" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="200"><stop offset="0%" stop-color="#faf9f5"></stop><stop offset="68%" stop-color="#f0f1eb"></stop><stop offset="100%" stop-color="#e5e9e1"></stop></linearGradient><linearGradient id="mpd-oak-_R_0_" gradientUnits="userSpaceOnUse" x1="0" y1="100" x2="0" y2="180"><stop offset="0%" stop-color="#ead8b8"></stop><stop offset="48%" stop-color="#cfae82"></stop><stop offset="100%" stop-color="#ac875b"></stop></linearGradient><linearGradient id="mpd-upholstery-_R_0_" x1="0" y1="0" x2="0.2" y2="1"><stop offset="0%" stop-color="#8b9f8c"></stop><stop offset="32%" stop-color="#637e68"></stop><stop offset="100%" stop-color="#405c48"></s