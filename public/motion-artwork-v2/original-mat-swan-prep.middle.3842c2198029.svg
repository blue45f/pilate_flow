<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" role="img" aria-labelledby="mpd-title-_R_0_" aria-describedby="mpd-desc-_R_0_" class="movement-phase-diagram-svg" data-exercise-id="original-mat-swan-prep" data-phase="middle" data-archetype-id="prone-swan-pulling-straps-swimming" data-apparatus="mat" data-body-position="prone" data-active-side="right" data-view-mirrored="false" data-production-method="free-authored-kinematic-svg-v1" data-anatomical-accuracy-assumed="false" data-visual-theme="studio" data-material-system="atelier-v2" data-detail-level="preview" style="width:100%;height:auto;display:block;aspect-ratio:8 / 5;border-radius:10px"><title id="mpd-title-_R_0_">매트 스완 준비 · 정점 자세 · 계획용 동작 도해</title><desc id="mpd-desc-_R_0_">전완(84,146)과 양손(52,146), 치골(144,144)을 매트에 고정한 채 흉골을 앞·위로 길게 밀어 올려 상·중부 흉추(92,122)를 부드럽게 신전합니다. 호흡 큐: 들숨 또는 날숨 유지: 복부 리프트를 유지하며 흉골을 전방 사선으로 확장합니다.. 지지면: 필라테스 매트 (전완·치골 매트 지지 속 상부 흉추 신전). 활성 타겟 근육: 흉추 신전근 (상·중부 척추기립근·다열근)(주동근 (주 타겟)), 광배근·능형근·하부 승모근 (견갑 하강·안정)(주동근 (주 타겟)), 심부 코어 (복횡근·골반저근 복부 리프트)(안정화근 (코어·정렬 유지)), 대둔근·햄스트링 (골반 후방 앵커 지지)(안정화근 (코어·정렬 유지)). Original App-Authored Kinematic Diagram (Free License)</desc><defs><linearGradient id="mpd-bg-_R_0_" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="200"><stop offset="0%" stop-color="#faf9f5"></stop><stop offset="68%" stop-color="#f0f1eb"></stop><stop offset="100%" stop-color="#e5e9e1"></stop></linearGradient><linearGradient id="mpd-oak-_R_0_" gradientUnits="userSpaceOnUse" x1="0" y1="100" x2="0" y2="180"><stop offset="0%" stop-color="#ead8b8"></stop><stop offset="48%" stop-color="#cfae82"></stop><stop offset="100%" stop-color="#ac875b"></stop></linearGradient><linearGradient id="mpd-upholstery-_R_0_" x1="0" y1="0" x2="0.2" y2="1"><stop offset="0%" stop-color="#8b9f8c"></stop><stop offset="32%" stop-color="#637e68"></stop><stop offset="100%" stop-color="#405c48"></stop></linearGradient><linearGradient