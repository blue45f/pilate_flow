<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" role="img" aria-labelledby="mpd-title-_R_0_" aria-describedby="mpd-desc-_R_0_" class="movement-phase-diagram-svg" data-exercise-id="ex-lower-01" data-phase="middle" data-archetype-id="standing-scooter-lunge-splits" data-apparatus="reformer" data-body-position="standing" data-active-side="right" data-view-mirrored="false" data-production-method="free-authored-kinematic-svg-v1" data-anatomical-accuracy-assumed="false" data-visual-theme="studio" data-material-system="atelier-v2" data-detail-level="preview" style="width:100%;height:auto;display:block;aspect-ratio:8 / 5;border-radius:10px"><title id="mpd-title-_R_0_">리포머 스탠딩 스쿠터 &amp; 이브스 런지 · 정점 자세 · 계획용 동작 도해</title><desc id="mpd-desc-_R_0_">지지 다리 무릎이 흔들리지 않게 버티면서 반대쪽 다리로 캐리지/페달/바닥을 길게 밀어내어 고관절을 신전·외전합니다. (양손 골반 또는 가슴 앞 기도 손(Hands in Prayer)에서 스쿠터 10회 + 펄스 10회 + 풀 런지 연결) 호흡 큐: 내쉬며 뒤쪽 다리 밀어내기. 지지면: 리포머 스탠딩 (선 자세) · 풋바(HIGH) · 헤드레스트(FLAT). 활성 타겟 근육: 대둔근 (후면 고관절 신전)(주동근 (주 타겟)), 중둔근·외전근군 (측면 골반 지지)(주동근 (주 타겟)), 대퇴사두근 (슬관절 신전·지지)(안정화근 (코어·정렬 유지)), 장요근·고관절 굴곡근 (전면 고관절)(신장·이완 부위). 앱 자체 제작 다관절 키네마틱 도해 (Original Free-License Kinematic SVG v1 · 외부 저작권 무관)</desc><defs><linearGradient id="mpd-bg-_R_0_" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="200"><stop offset="0%" stop-color="#faf9f5"></stop><stop offset="68%" stop-color="#f0f1eb"></stop><stop offset="100%" stop-color="#e5e9e1"></stop></linearGradient><linearGradient id="mpd-oak-_R_0_" gradientUnits="userSpaceOnUse" x1="0" y1="100" x2="0" y2="180"><stop offset="0%" stop-color="#ead8b8"></stop><stop offset="48%" stop-color="#cfae82"></stop><stop offset="100%" stop-color="#ac875b"></stop></linearGradient><linearGradient id="mpd-upholstery-_R_0_" x1="0" y1="0" x2="0.2" y2="1"><stop offset="0%" stop-color="#8b9f8c"></stop><stop offset="32%" stop-color="#637e68"></stop><stop offset="100%" stop-color="#405c48"></stop></linearGradient><li