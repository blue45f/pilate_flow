<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" role="img" aria-labelledby="mpd-title-_R_0_" aria-describedby="mpd-desc-_R_0_" class="movement-phase-diagram-svg" data-exercise-id="ex-straps-01" data-phase="end" data-archetype-id="supine-feet-in-straps" data-apparatus="reformer" data-body-position="supine" data-active-side="right" data-view-mirrored="false" data-production-method="free-authored-kinematic-svg-v1" data-anatomical-accuracy-assumed="false" data-visual-theme="studio" data-material-system="atelier-v2" data-detail-level="preview" style="width:100%;height:auto;display:block;aspect-ratio:8 / 5;border-radius:10px"><title id="mpd-title-_R_0_">리포머 핏인스트랩 (프로그 · 레그써클 · 피터팬 · 숏스파인) · 마무리 자세 · 계획용 동작 도해</title><desc id="mpd-desc-_R_0_">꼬리뼈가 바닥에서 말려 올라오지 않는 한계점까지 다리를 천장 쪽으로 들어 올려 후면 사슬을 신장합니다. (주의: 숏스파인(Short Spine)으로 이어갈 경우 반드시 헤드레스트를 완전히 평평하게(Flat) 내린 뒤 진행하세요!) 호흡 큐: 들쉬며 꼬리뼈가 뜨지 않는 범위까지만 다리 들어 올리기. 지지면: 리포머 수파인 (누운 자세) · 풋바(LOW) · 헤드레스트(UP). 활성 타겟 근육: 내전근군 (하지 중심선 연결)(주동근 (주 타겟)), 심부 코어 (복횡근·다열근·골반저근)(안정화근 (코어·정렬 유지)), 햄스트링 (슬관절 굴곡·후면 사슬)(신장·이완 부위). 앱 자체 제작 다관절 키네마틱 도해 (Original Free-License Kinematic SVG v1 · 외부 저작권 무관)</desc><defs><linearGradient id="mpd-bg-_R_0_" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="200"><stop offset="0%" stop-color="#faf9f5"></stop><stop offset="68%" stop-color="#f0f1eb"></stop><stop offset="100%" stop-color="#e5e9e1"></stop></linearGradient><linearGradient id="mpd-oak-_R_0_" gradientUnits="userSpaceOnUse" x1="0" y1="100" x2="0" y2="180"><stop offset="0%" stop-color="#ead8b8"></stop><stop offset="48%" stop-color="#cfae82"></stop><stop offset="100%" stop-color="#ac875b"></stop></linearGradient><linearGradient id="mpd-upholstery-_R_0_" x1="0" y1="0" x2="0.2" y2="1"><stop offset="0%" stop-color="#8b9f8c"></stop><stop offset="32%" stop-color="#637e68"></stop><stop offset="100%" stop-color="#405c48"></stop></linearGradient><linearGradient id="mp