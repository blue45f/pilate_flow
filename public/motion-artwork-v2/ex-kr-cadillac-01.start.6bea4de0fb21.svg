<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" role="img" aria-labelledby="mpd-title-_R_0_" aria-describedby="mpd-desc-_R_0_" class="movement-phase-diagram-svg" data-exercise-id="ex-kr-cadillac-01" data-phase="start" data-archetype-id="supine-chest-lift-curl" data-apparatus="cadillac" data-body-position="supine" data-active-side="right" data-view-mirrored="false" data-production-method="free-authored-kinematic-svg-v1" data-anatomical-accuracy-assumed="false" data-visual-theme="studio" data-material-system="atelier-v2" data-detail-level="preview" style="width:100%;height:auto;display:block;aspect-ratio:8 / 5;border-radius:10px"><title id="mpd-title-_R_0_">[국내 시퀀스] 단필라 캐딜락 푸쉬스루바 척추 분절 &amp; 티저 플로우 · 시작 자세 · 계획용 동작 도해</title><desc id="mpd-desc-_R_0_">매트(y=144) 위에 후두골부터 천골(S1)·뒤꿈치까지 길게 눕고, 하부 흉곽이 들뜨지 않게 고정한 상태에서 경추 끄덕임(Head Nod)을 준비합니다. 호흡 큐: 코로 마시며 정수리와 발끝을 양방향으로 길게 늘이고 턱 끝을 가볍게 당깁니다.. 지지면: 필라테스 매트 수평 기준면 (y=144). 활성 타겟 근육: 복직근 · 외/내복사근(주동근 (주 타겟)), 복횡근 · 심부 골반저근(안정화근 (코어·정렬 유지)). 앱 자체 제작 2D 키네마틱 도해 (자유 라이선스 · 외부 프레임 무차용)</desc><defs><linearGradient id="mpd-bg-_R_0_" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="200"><stop offset="0%" stop-color="#faf9f5"></stop><stop offset="68%" stop-color="#f0f1eb"></stop><stop offset="100%" stop-color="#e5e9e1"></stop></linearGradient><linearGradient id="mpd-oak-_R_0_" gradientUnits="userSpaceOnUse" x1="0" y1="100" x2="0" y2="180"><stop offset="0%" stop-color="#ead8b8"></stop><stop offset="48%" stop-color="#cfae82"></stop><stop offset="100%" stop-color="#ac875b"></stop></linearGradient><linearGradient id="mpd-upholstery-_R_0_" x1="0" y1="0" x2="0.2" y2="1"><stop offset="0%" stop-color="#8b9f8c"></stop><stop offset="32%" stop-color="#637e68"></stop><stop offset="100%" stop-color="#405c48"></stop></linearGradient><linearGradient id="mpd-torso-_R_0_" x1="0.05" y1="0" x2="0.9" y2="0.9"><stop offset="0%" stop-color="#789785"></stop><stop of