<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" role="img" aria-labelledby="mpd-title-_R_0_" aria-describedby="mpd-desc-_R_0_" class="movement-phase-diagram-svg" data-exercise-id="ex-straps-02" data-phase="end" data-archetype-id="supine-feet-in-straps" data-apparatus="cadillac" data-body-position="supine" data-active-side="right" data-view-mirrored="false" data-production-method="free-authored-kinematic-svg-v1" data-anatomical-accuracy-assumed="false" data-visual-theme="studio" data-material-system="atelier-v2" data-detail-level="preview" style="width:100%;height:auto;display:block;aspect-ratio:8 / 5;border-radius:10px"><title id="mpd-title-_R_0_">캐딜락 레그 스프링 프로그 &amp; 에어플레인 써클 · 마무리 자세 · 계획용 동작 도해</title><desc id="mpd-desc-_R_0_">외측 원호를 돌아 고관절 상방 정점 영역(-78°~-90°)으로 흔들림 없이 복귀하여 잠시 정지(Pause)하고, 골반 중립과 지지 다리 앵커를 재확인한 뒤 반대 방향 서클을 이어갑니다. 호흡 큐: 날숨 마무리: 갈비뼈와 골반 연결을 유지하며 정점 제어 정지 후 역방향 전환. 지지면: 캐딜락 베드 앙와위 (천골 매트 밀착 &amp; 레그 스프링 원 궤적 제어). 활성 타겟 근육: 장요근·대퇴직근 (작동 다리 원 궤적 제어)(주동근 (주 타겟)), 내전근군·중둔근 (내전 교차 및 외전 회수 제어)(주동근 (주 타겟)), 심부 코어·복횡근·복사근 (골반 수평 앵커 고정)(안정화근 (코어·정렬 유지)), 햄스트링·종아리 (후면 사슬 신장 및 지지 다리 고정)(신장·이완 부위). 앱 자체 저작 2D 고관절·하지 역학 도해 (Original App-Authored Free License · anatomicalAccuracyAssumed: false)</desc><defs><linearGradient id="mpd-bg-_R_0_" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="200"><stop offset="0%" stop-color="#faf9f5"></stop><stop offset="68%" stop-color="#f0f1eb"></stop><stop offset="100%" stop-color="#e5e9e1"></stop></linearGradient><linearGradient id="mpd-oak-_R_0_" gradientUnits="userSpaceOnUse" x1="0" y1="100" x2="0" y2="180"><stop offset="0%" stop-color="#ead8b8"></stop><stop offset="48%" stop-color="#cfae82"></stop><stop offset="100%" stop-color="#ac875b"></stop></linearGradient><linearGradient id="mpd-upholstery-_R_0_" x1="0" y1="0" x2="0.2" y2="1"><stop offset="0%" stop-color="#8b9f8c"></stop><stop offset="32%" stop-color="#637e68"></stop><stop offs