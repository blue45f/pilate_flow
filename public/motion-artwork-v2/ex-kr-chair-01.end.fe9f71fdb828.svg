<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" role="img" aria-labelledby="mpd-title-_R_0_" aria-describedby="mpd-desc-_R_0_" class="movement-phase-diagram-svg" data-exercise-id="ex-kr-chair-01" data-phase="end" data-archetype-id="chair-plank-pike-isolated" data-apparatus="chair" data-body-position="quadruped" data-active-side="right" data-view-mirrored="false" data-production-method="free-authored-kinematic-svg-v1" data-anatomical-accuracy-assumed="false" data-visual-theme="studio" data-material-system="atelier-v2" data-detail-level="preview" style="width:100%;height:auto;display:block;aspect-ratio:8 / 5;border-radius:10px"><title id="mpd-title-_R_0_">[국내 시퀀스] Today Sequence 운다 체어 페달 플랭크 &amp; 파이크 코어 · 복귀 자세 · 계획용 동작 도해</title><desc id="mpd-desc-_R_0_">허리가 바닥으로 꺾여 떨어지지 않도록 둔근과 복횡근을 조이며 긴 플랭크 라인으로 컨트롤 복귀합니다. (주의: 손목 통증이 있는 회원님은 전완근(Forearm)을 시트에 대고 진행하도록 수정합니다.) 호흡 큐: 내쉬며 아랫배를 천장으로 끌어올려 파이크 업. 지지면: 운다 체어 쿼드러페드 (네발기기). 활성 타겟 근육: 심부 코어 (복횡근·다열근·골반저근)(주동근 (주 타겟)), 복직근·내외복사근 (전측면 코어)(안정화근 (코어·정렬 유지)), 햄스트링 (슬관절 굴곡·후면 사슬)(신장·이완 부위). 앱 자체 제작 다관절 키네마틱 도해 (Original Free-License Kinematic SVG v1 · 외부 저작권 무관)</desc><defs><linearGradient id="mpd-bg-_R_0_" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="200"><stop offset="0%" stop-color="#faf9f5"></stop><stop offset="68%" stop-color="#f0f1eb"></stop><stop offset="100%" stop-color="#e5e9e1"></stop></linearGradient><linearGradient id="mpd-oak-_R_0_" gradientUnits="userSpaceOnUse" x1="0" y1="100" x2="0" y2="180"><stop offset="0%" stop-color="#ead8b8"></stop><stop offset="48%" stop-color="#cfae82"></stop><stop offset="100%" stop-color="#ac875b"></stop></linearGradient><linearGradient id="mpd-upholstery-_R_0_" x1="0" y1="0" x2="0.2" y2="1"><stop offset="0%" stop-color="#8b9f8c"></stop><stop offset="32%" stop-color="#637e68"></stop><stop offset="100%" stop-color="#405c48"></stop></linearGradient><linearGradient id="mpd-torso-_R_0_" x1="0.0