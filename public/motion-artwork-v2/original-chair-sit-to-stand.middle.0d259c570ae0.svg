<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" role="img" aria-labelledby="mpd-title-_R_0_" aria-describedby="mpd-desc-_R_0_" class="movement-phase-diagram-svg" data-exercise-id="original-chair-sit-to-stand" data-phase="middle" data-archetype-id="chair-sit-to-stand-isolated" data-apparatus="chair" data-body-position="standing" data-active-side="right" data-view-mirrored="false" data-production-method="free-authored-kinematic-svg-v1" data-anatomical-accuracy-assumed="false" data-visual-theme="studio" data-material-system="atelier-v2" data-detail-level="preview" style="width:100%;height:auto;display:block;aspect-ratio:8 / 5;border-radius:10px"><title id="mpd-title-_R_0_">체어 앉았다 일어서기 · 정점 자세 · 계획용 동작 도해</title><desc id="mpd-desc-_R_0_">양발(ankle: 186,170)을 바닥에 고정한 채 체어 시트(pelvis: 136,108)에서 발바닥으로 바닥을 밀며 상체와 골반(178,102, head: 178,16)을 수직으로 일으켜 세웁니다. (움직이지 않는 좌면과 발 위치를 확인하고 천천히 일어섰다 앉습니다.) 호흡 큐: 날숨: 지지 무릎 1mm도 흔들림 없이 가동 다리 길게 프레스. 지지면: 운다 체어 스탠딩 (선 자세). 활성 타겟 근육: 대둔근 (후면 고관절 신전)(주동근 (주 타겟)), 중둔근·외전근군 (측면 골반 지지)(주동근 (주 타겟)), 대퇴사두근 (슬관절 신전·지지)(안정화근 (코어·정렬 유지)), 장요근·고관절 굴곡근 (전면 고관절)(신장·이완 부위). 앱 자체 제작 다관절 키네마틱 도해 (Original Free-License Kinematic SVG v1 · 외부 저작권 무관)</desc><defs><linearGradient id="mpd-bg-_R_0_" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="200"><stop offset="0%" stop-color="#faf9f5"></stop><stop offset="68%" stop-color="#f0f1eb"></stop><stop offset="100%" stop-color="#e5e9e1"></stop></linearGradient><linearGradient id="mpd-oak-_R_0_" gradientUnits="userSpaceOnUse" x1="0" y1="100" x2="0" y2="180"><stop offset="0%" stop-color="#ead8b8"></stop><stop offset="48%" stop-color="#cfae82"></stop><stop offset="100%" stop-color="#ac875b"></stop></linearGradient><linearGradient id="mpd-upholstery-_R_0_" x1="0" y1="0" x2="0.2" y2="1"><stop offset="0%" stop-color="#8b9f8c"></stop><stop offset="32%" stop-color="#637e68"></stop><stop offset="100%" stop-color="#405c48"></stop></l