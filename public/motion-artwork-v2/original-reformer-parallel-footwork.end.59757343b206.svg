<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" role="img" aria-labelledby="mpd-title-_R_0_" aria-describedby="mpd-desc-_R_0_" class="movement-phase-diagram-svg" data-exercise-id="original-reformer-parallel-footwork" data-phase="end" data-archetype-id="reformer-supine-footwork" data-apparatus="reformer" data-body-position="supine" data-active-side="right" data-view-mirrored="false" data-production-method="free-authored-kinematic-svg-v1" data-anatomical-accuracy-assumed="false" data-visual-theme="studio" data-material-system="atelier-v2" data-detail-level="preview" style="width:100%;height:auto;display:block;aspect-ratio:8 / 5;border-radius:10px"><title id="mpd-title-_R_0_">패럴렐 풋워크 · 복귀 자세 · 계획용 동작 도해</title><desc id="mpd-desc-_R_0_">같은 발 위치를 유지하며 무릎을 접고 캐리지와 함께 시작 자리로 돌아옵니다. (주의: 강사 검토 전 계획 자료입니다. 캐리지·스토퍼·풋바·스트랩을 확인합니다. 스프링은 제조사 지침과 대상자에 맞게 강사가 직접 설정합니다. 무릎을 잠그거나 캐리지를 끝까지 부딪치지 않도록 범위를 정합니다.) 호흡 큐: 숨을 참지 않고 복귀 속도를 제어합니다.. 지지면: 리포머 수파인 (누운 자세) · 풋바(MID) · 헤드레스트(FLAT). 활성 타겟 근육: 대퇴사두근 (슬관절 신전·지지)(주동근 (주 타겟)), 심부 코어 (복횡근·다열근·골반저근)(안정화근 (코어·정렬 유지)), 종아리·발목 안정근 (비복근·가자미근)(신장·이완 부위). 앱 자체 제작 다관절 키네마틱 도해 (Original Free-License Kinematic SVG v1 · 외부 저작권 무관)</desc><defs><linearGradient id="mpd-bg-_R_0_" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="200"><stop offset="0%" stop-color="#faf9f5"></stop><stop offset="68%" stop-color="#f0f1eb"></stop><stop offset="100%" stop-color="#e5e9e1"></stop></linearGradient><linearGradient id="mpd-oak-_R_0_" gradientUnits="userSpaceOnUse" x1="0" y1="100" x2="0" y2="180"><stop offset="0%" stop-color="#ead8b8"></stop><stop offset="48%" stop-color="#cfae82"></stop><stop offset="100%" stop-color="#ac875b"></stop></linearGradient><linearGradient id="mpd-upholstery-_R_0_" x1="0" y1="0" x2="0.2" y2="1"><stop offset="0%" stop-color="#8b9f8c"></stop><stop offset="32%" stop-color="#637e68"></stop><stop offset="100%" stop-color="#405c48"></stop></linearGrad