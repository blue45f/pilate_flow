<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" role="img" aria-labelledby="mpd-title-_R_0_" aria-describedby="mpd-desc-_R_0_" class="movement-phase-diagram-svg" data-exercise-id="original-cadillac-side-leg-reach" data-phase="middle" data-archetype-id="side-lying-leg-press-sweep" data-apparatus="cadillac" data-body-position="side-lying" data-active-side="right" data-view-mirrored="false" data-production-method="free-authored-kinematic-svg-v1" data-anatomical-accuracy-assumed="false" data-visual-theme="studio" data-material-system="atelier-v2" data-detail-level="preview" style="width:100%;height:auto;display:block;aspect-ratio:8 / 5;border-radius:10px"><title id="mpd-title-_R_0_">테이블 사이드 레그 리치 · 정점 자세 · 계획용 동작 도해</title><desc id="mpd-desc-_R_0_">몸통과 골반이 뒤로 말리거나 흔들리지 않게(pelvisDriftMm=0) 고정한 채, 위쪽 작동 다리를 고관절 높이 수평면에서 앞으로 스윕(-40°)하며 발목 배굴(Dorsiflexion) 상태로 후면 사슬을 길게 늘입니다. 호흡 큐: 들숨(또는 짧은 2회 코 들숨): 허리가 둥글어지지 않는 범위까지 전방 배굴 더블 펄스. 지지면: 캐딜락 베드 측와위 (양측 골반 수직 적층 &amp; 레그 스프링 리치). 활성 타겟 근육: 중둔근·소둔근 (고관절 높이 수평 유지 &amp; 외전 지지)(주동근 (주 타겟)), 대둔근·고관절 굴곡/신전근 (전방 배굴 킥 &amp; 후방 저굴 리치)(주동근 (주 타겟)), 심부 코어·복사근 (수직 적층 골반 &amp; 귀-어깨-고관절 일직선 고정)(안정화근 (코어·정렬 유지)), 햄스트링·장요근 (전방 킥 후면 신장 &amp; 후방 리치 전면 신장)(신장·이완 부위). 앱 자체 저작 2D 고관절·하지 역학 도해 (Original App-Authored Free License · anatomicalAccuracyAssumed: false)</desc><defs><linearGradient id="mpd-bg-_R_0_" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="200"><stop offset="0%" stop-color="#faf9f5"></stop><stop offset="68%" stop-color="#f0f1eb"></stop><stop offset="100%" stop-color="#e5e9e1"></stop></linearGradient><linearGradient id="mpd-oak-_R_0_" gradientUnits="userSpaceOnUse" x1="0" y1="100" x2="0" y2="180"><stop offset="0%" stop-color="#ead8b8"></stop><stop offset="48%" stop-color="#cfae82"></stop><stop offset="100%" stop-color="#ac875b"></stop></linearGradient><linearGradient id="mpd-upholstery-_R_0_" x1="0" y1="0" x2="0.2" y2="1"><stop offset="0%"