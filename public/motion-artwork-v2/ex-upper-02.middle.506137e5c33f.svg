<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" role="img" aria-labelledby="mpd-title-_R_0_" aria-describedby="mpd-desc-_R_0_" class="movement-phase-diagram-svg" data-exercise-id="ex-upper-02" data-phase="middle" data-archetype-id="seated-row-arm-arc" data-apparatus="reformer" data-body-position="seated" data-active-side="right" data-view-mirrored="false" data-production-method="free-authored-kinematic-svg-v1" data-anatomical-accuracy-assumed="false" data-visual-theme="studio" data-material-system="atelier-v2" data-detail-level="preview" style="width:100%;height:auto;display:block;aspect-ratio:8 / 5;border-radius:10px"><title id="mpd-title-_R_0_">리포머 백 로잉 &amp; 프론트 로잉 (써브 어 트레이 &amp; 쉐이브) · 정점 자세 · 계획용 동작 도해</title><desc id="mpd-desc-_R_0_">승모근이 솟지 않게 쇄골을 옆으로 열면서 팔꿈치를 몸통 뒤로 보내 날개뼈 아래쪽을 조여줍니다. (1B 스프링에서 백 로잉 6회 + 써브 어 트레이 8회 + 더 쉐이브 8회) 호흡 큐: 내쉬며 팔을 앞으로 뻗어 트레이 서빙. 지지면: 리포머 시티드 (앉은 자세) · 풋바(LOW) · 헤드레스트(FLAT). 활성 타겟 근육: 광배근·전거근·하부승모근 (견갑 안정)(주동근 (주 타겟)), 삼각근·상완이두/삼두근 (상지 주동)(주동근 (주 타겟)), 심부 코어 (복횡근·다열근·골반저근)(안정화근 (코어·정렬 유지)), 척추기립근·흉추 신전근 (후면 척추)(신장·이완 부위). 앱 자체 제작 다관절 키네마틱 도해 (Original Free-License Kinematic SVG v1 · 외부 저작권 무관)</desc><defs><linearGradient id="mpd-bg-_R_0_" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="200"><stop offset="0%" stop-color="#faf9f5"></stop><stop offset="68%" stop-color="#f0f1eb"></stop><stop offset="100%" stop-color="#e5e9e1"></stop></linearGradient><linearGradient id="mpd-oak-_R_0_" gradientUnits="userSpaceOnUse" x1="0" y1="100" x2="0" y2="180"><stop offset="0%" stop-color="#ead8b8"></stop><stop offset="48%" stop-color="#cfae82"></stop><stop offset="100%" stop-color="#ac875b"></stop></linearGradient><linearGradient id="mpd-upholstery-_R_0_" x1="0" y1="0" x2="0.2" y2="1"><stop offset="0%" stop-color="#8b9f8c"></stop><stop offset="32%" stop-color="#637e68"></stop><stop offset="100%" stop-color="#405c48"></stop></linearGradient><linearGradient i