<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" role="img" aria-labelledby="mpd-title-_R_0_" aria-describedby="mpd-desc-_R_0_" class="movement-phase-diagram-svg" data-exercise-id="ex-lower-03" data-phase="middle" data-archetype-id="chair-seat-pedal-step-up" data-apparatus="chair" data-body-position="standing" data-active-side="right" data-view-mirrored="false" data-production-method="free-authored-kinematic-svg-v1" data-anatomical-accuracy-assumed="false" data-visual-theme="studio" data-material-system="atelier-v2" data-detail-level="preview" style="width:100%;height:auto;display:block;aspect-ratio:8 / 5;border-radius:10px"><title id="mpd-title-_R_0_">운다 체어 스탠딩 포워드 런지 &amp; 마운틴 클라이머 · 정점 자세 · 계획용 동작 도해</title><desc id="mpd-desc-_R_0_">앞발은 좌면 위에 고정하고 반대 발볼은 회전 페달 끝을 따라 움직입니다. 완전한 올라서기나 빠른 마운틴 클라이머는 포함하지 않는 작은 스텝업 대표 자세입니다. (양손 골반 짚고 포워드 런지 8회 + 탑에서 마운틴 클라이머 펌핑 12회 (좌/우)) 호흡 큐: 내쉬며 시트 위 뒤꿈치로 바닥 밀어 스텝업. 지지면: 운다 체어 스탠딩 (선 자세). 활성 타겟 근육: 대둔근 (후면 고관절 신전)(주동근 (주 타겟)), 중둔근·외전근군 (측면 골반 지지)(주동근 (주 타겟)), 대퇴사두근 (슬관절 신전·지지)(안정화근 (코어·정렬 유지)), 장요근·고관절 굴곡근 (전면 고관절)(신장·이완 부위). 앱 자체 제작 다관절 키네마틱 도해 (Original Free-License Kinematic SVG v1 · 외부 저작권 무관)</desc><defs><linearGradient id="mpd-bg-_R_0_" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="200"><stop offset="0%" stop-color="#faf9f5"></stop><stop offset="68%" stop-color="#f0f1eb"></stop><stop offset="100%" stop-color="#e5e9e1"></stop></linearGradient><linearGradient id="mpd-oak-_R_0_" gradientUnits="userSpaceOnUse" x1="0" y1="100" x2="0" y2="180"><stop offset="0%" stop-color="#ead8b8"></stop><stop offset="48%" stop-color="#cfae82"></stop><stop offset="100%" stop-color="#ac875b"></stop></linearGradient><linearGradient id="mpd-upholstery-_R_0_" x1="0" y1="0" x2="0.2" y2="1"><stop offset="0%" stop-color="#8b9f8c"></stop><stop offset="32%" stop-color="#637e68"></stop><stop offset="100%" stop-color="#405c48"></stop></linearGradient><linearGradi