<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" role="img" aria-labelledby="mpd-title-_R_0_" aria-describedby="mpd-desc-_R_0_" class="movement-phase-diagram-svg" data-exercise-id="original-cadillac-table-bridge" data-phase="middle" data-archetype-id="supine-articulated-bridge" data-apparatus="cadillac" data-body-position="supine" data-active-side="right" data-view-mirrored="false" data-production-method="free-authored-kinematic-svg-v1" data-anatomical-accuracy-assumed="false" data-visual-theme="studio" data-material-system="atelier-v2" data-detail-level="preview" style="width:100%;height:auto;display:block;aspect-ratio:8 / 5;border-radius:10px"><title id="mpd-title-_R_0_">캐딜락 테이블 브리지 · 정점 자세 · 계획용 동작 도해</title><desc id="mpd-desc-_R_0_">양발로 수평 테이블을 밀고 수직 기둥 손 지지로 견갑대를 안정화하며 골반(184,103)을 들어 어깨(92,140)-고관절(192,100)-무릎(232,84) 사선(21.8°)을 만듭니다. 호흡 큐: 날숨: 테이블 상면을 발로 밀며 편안한 사선 높이까지 골반 리프트. 지지면: 캐딜락 수평 테이블 베드(y:143) · 수직 기둥(Upright Poles) 양손 지지 · 무스프링. 활성 타겟 근육: 대둔근 (후면 고관절 신전)(주동근 (주 타겟)), 햄스트링 (슬관절 굴곡·후면 사슬)(주동근 (주 타겟)), 광배근·전거근·하부승모근 (수직 기둥 상지 지지)(안정화근 (코어·정렬 유지)), 장요근·고관절 굴곡근 (전면 고관절)(신장·이완 부위). 앱 자체 제작 다관절 키네마틱 도해 (Original Free-License Kinematic SVG v1 · 외부 저작권 무관 · 해부학 미검증)</desc><defs><linearGradient id="mpd-bg-_R_0_" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="200"><stop offset="0%" stop-color="#faf9f5"></stop><stop offset="68%" stop-color="#f0f1eb"></stop><stop offset="100%" stop-color="#e5e9e1"></stop></linearGradient><linearGradient id="mpd-oak-_R_0_" gradientUnits="userSpaceOnUse" x1="0" y1="100" x2="0" y2="180"><stop offset="0%" stop-color="#ead8b8"></stop><stop offset="48%" stop-color="#cfae82"></stop><stop offset="100%" stop-color="#ac875b"></stop></linearGradient><linearGradient id="mpd-upholstery-_R_0_" x1="0" y1="0" x2="0.2" y2="1"><stop offset="0%" stop-color="#8b9f8c"></stop><stop offset="32%" stop-color="#637e68"></stop><stop offset="100%" stop-color="#40