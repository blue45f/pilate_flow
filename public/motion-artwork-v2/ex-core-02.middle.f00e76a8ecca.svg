<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" role="img" aria-labelledby="mpd-title-_R_0_" aria-describedby="mpd-desc-_R_0_" class="movement-phase-diagram-svg" data-exercise-id="ex-core-02" data-phase="middle" data-archetype-id="reformer-short-box-supported-roll-back" data-apparatus="reformer" data-body-position="seated" data-active-side="right" data-view-mirrored="false" data-production-method="free-authored-kinematic-svg-v1" data-anatomical-accuracy-assumed="false" data-visual-theme="studio" data-material-system="atelier-v2" data-detail-level="preview" style="width:100%;height:auto;display:block;aspect-ratio:8 / 5;border-radius:10px"><title id="mpd-title-_R_0_">숏박스 앱 시리즈 (라운드백 · 플랫백 · 오블리크 트위스트) · 정점 자세 · 계획용 동작 도해</title><desc id="mpd-desc-_R_0_">골반이 박스 뒤의 캐리지에 내려앉지 않도록 박스 상면에 맞춥니다. 발 지지를 유지한 라운드백 준비만 표시하며 플랫백·회전은 별도 변형입니다. (다웰 바(Dowel Bar)를 들고 라운드백 6회 + 플랫백 6회 + 트위스트 6회) 호흡 큐: 들쉬며 꼬리뼈 말아 하프 롤백. 지지면: 리포머 시티드 (앉은 자세) · 숏박스(Short Box) 장착 · 풋바(DOWN) · 헤드레스트(FLAT). 활성 타겟 근육: 복직근·내외복사근 (전측면 코어)(주동근 (주 타겟)), 장요근·고관절 굴곡근 (전면 고관절)(주동근 (주 타겟)), 심부 코어 (복횡근·다열근·골반저근)(안정화근 (코어·정렬 유지)), 척추기립근·흉추 신전근 (후면 척추)(신장·이완 부위). 앱 자체 제작 다관절 키네마틱 도해 (Original Free-License Kinematic SVG v1 · 외부 저작권 무관)</desc><defs><linearGradient id="mpd-bg-_R_0_" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="200"><stop offset="0%" stop-color="#faf9f5"></stop><stop offset="68%" stop-color="#f0f1eb"></stop><stop offset="100%" stop-color="#e5e9e1"></stop></linearGradient><linearGradient id="mpd-oak-_R_0_" gradientUnits="userSpaceOnUse" x1="0" y1="100" x2="0" y2="180"><stop offset="0%" stop-color="#ead8b8"></stop><stop offset="48%" stop-color="#cfae82"></stop><stop offset="100%" stop-color="#ac875b"></stop></linearGradient><linearGradient id="mpd-upholstery-_R_0_" x1="0" y1="0" x2="0.2" y2="1"><stop offset="0%" stop-color="#8b9f8c"></stop><stop offset="32%" stop-color="#637e68"></stop><stop offset="100%" stop-c