<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" role="img" aria-labelledby="mpd-title-_R_0_" aria-describedby="mpd-desc-_R_0_" class="movement-phase-diagram-svg" data-exercise-id="original-cadillac-quadruped-slide" data-phase="end" data-archetype-id="quadruped-reach-slide" data-apparatus="cadillac" data-body-position="quadruped" data-active-side="right" data-view-mirrored="false" data-production-method="free-authored-kinematic-svg-v1" data-anatomical-accuracy-assumed="false" data-visual-theme="studio" data-material-system="atelier-v2" data-detail-level="preview" style="width:100%;height:auto;display:block;aspect-ratio:8 / 5;border-radius:10px"><title id="mpd-title-_R_0_">테이블 네발기기 슬라이드 · 복귀 자세 · 계획용 동작 도해</title><desc id="mpd-desc-_R_0_">허리가 출렁이거나 골반이 기울지 않게 속도를 제어하며 손과 무릎을 제자리로 되돌립니다. (주의: 강사 검토 전 계획 자료입니다. 바·스프링·클립·안전 스트랩을 제조사 지침에 따라 점검합니다. 바의 이동 범위와 보조 위치는 강사가 결정합니다. 테이블 가장자리와 바의 위치를 확인하고 손목·무릎의 지지를 조정합니다.) 호흡 큐: 들숨: 지지 측 어깨·골반이 무너지지 않게 사뿐히 복귀. 지지면: 캐딜락 쿼드러페드 (네발기기). 활성 타겟 근육: 심부 코어 (복횡근·다열근·골반저근)(주동근 (주 타겟)), 광배근·전거근·하부승모근 (견갑 안정)(안정화근 (코어·정렬 유지)), 척추기립근·흉추 신전근 (후면 척추)(신장·이완 부위). 앱 자체 제작 다관절 키네마틱 도해 (Original Free-License Kinematic SVG v1 · 외부 저작권 무관)</desc><defs><linearGradient id="mpd-bg-_R_0_" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="200"><stop offset="0%" stop-color="#faf9f5"></stop><stop offset="68%" stop-color="#f0f1eb"></stop><stop offset="100%" stop-color="#e5e9e1"></stop></linearGradient><linearGradient id="mpd-oak-_R_0_" gradientUnits="userSpaceOnUse" x1="0" y1="100" x2="0" y2="180"><stop offset="0%" stop-color="#ead8b8"></stop><stop offset="48%" stop-color="#cfae82"></stop><stop offset="100%" stop-color="#ac875b"></stop></linearGradient><linearGradient id="mpd-upholstery-_R_0_" x1="0" y1="0" x2="0.2" y2="1"><stop offset="0%" stop-color="#8b9f8c"></stop><stop offset="32%" stop-color="#637e68"></stop><stop offset="100%" stop-color="#405c48"></stop></line