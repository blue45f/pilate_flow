<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" role="img" aria-labelledby="mpd-title-_R_0_" aria-describedby="mpd-desc-_R_0_" class="movement-phase-diagram-svg" data-exercise-id="ex-warmup-02" data-phase="middle" data-archetype-id="cadillac-kneeling-cat-stretch-isolated" data-apparatus="cadillac" data-body-position="kneeling" data-active-side="right" data-view-mirrored="false" data-production-method="free-authored-kinematic-svg-v1" data-anatomical-accuracy-assumed="false" data-visual-theme="studio" data-material-system="atelier-v2" data-detail-level="preview" style="width:100%;height:auto;display:block;aspect-ratio:8 / 5;border-radius:10px"><title id="mpd-title-_R_0_">캐딜락 롤다운 바 흉추 모빌리티 &amp; 캣 스트레치 · 정점 자세 · 계획용 동작 도해</title><desc id="mpd-desc-_R_0_">양무릎(146,142) 지지 위에서 복부를 등 쪽으로 당기며 정수리(142,30→188,76)와 흉추(142,86→152,68)를 둥글게 말아 롤다운 바(hand: 198,78→230,114)를 아래로 밀어냅니다. (톨 닐링(Tall Kneeling) 자세에서 롤다운 + 하단 스완 신전 연결) 호흡 큐: 들쉬며 정수리 길게 세우기. 지지면: 캐딜락 닐링 (무릎 선 자세). 활성 타겟 근육: 광배근·전거근·하부승모근 (견갑 안정)(주동근 (주 타겟)), 삼각근·상완이두/삼두근 (상지 주동)(주동근 (주 타겟)), 대둔근 (후면 고관절 신전)(안정화근 (코어·정렬 유지)), 장요근·고관절 굴곡근 (전면 고관절)(신장·이완 부위). 앱 자체 제작 다관절 키네마틱 도해 (Original Free-License Kinematic SVG v1 · 외부 저작권 무관)</desc><defs><linearGradient id="mpd-bg-_R_0_" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="200"><stop offset="0%" stop-color="#faf9f5"></stop><stop offset="68%" stop-color="#f0f1eb"></stop><stop offset="100%" stop-color="#e5e9e1"></stop></linearGradient><linearGradient id="mpd-oak-_R_0_" gradientUnits="userSpaceOnUse" x1="0" y1="100" x2="0" y2="180"><stop offset="0%" stop-color="#ead8b8"></stop><stop offset="48%" stop-color="#cfae82"></stop><stop offset="100%" stop-color="#ac875b"></stop></linearGradient><linearGradient id="mpd-upholstery-_R_0_" x1="0" y1="0" x2="0.2" y2="1"><stop offset="0%" stop-color="#8b9f8c"></stop><stop offset="32%" stop-color="#637e68"></stop><stop offset="100%" stop-color="#405c