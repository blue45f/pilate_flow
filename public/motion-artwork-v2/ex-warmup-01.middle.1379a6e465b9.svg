<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" role="img" aria-labelledby="mpd-title-_R_0_" aria-describedby="mpd-desc-_R_0_" class="movement-phase-diagram-svg" data-exercise-id="ex-warmup-01" data-phase="middle" data-archetype-id="supine-breath-pelvic-clock" data-apparatus="reformer" data-body-position="supine" data-active-side="right" data-view-mirrored="false" data-production-method="free-authored-kinematic-svg-v1" data-anatomical-accuracy-assumed="false" data-visual-theme="studio" data-material-system="atelier-v2" data-detail-level="preview" style="width:100%;height:auto;display:block;aspect-ratio:8 / 5;border-radius:10px"><title id="mpd-title-_R_0_">펠빅 클락 &amp; 흉식 호흡 임프린팅 · 정점 자세 · 계획용 동작 도해</title><desc id="mpd-desc-_R_0_">날숨에 요추를 부드럽게 임프린트(12시 방향)하며 양팔을 갈비뼈가 들뜨지 않는 범위까지 원호로 보냅니다. (미니볼 30% 조이기 + 골반 시계 방향/반시계 방향 12방위 서클) 호흡 큐: 코로 깊게 들쉬며 갈비뼈 양옆 확장. 지지면: 리포머 수파인 (누운 자세) · 풋바(HIGH) · 헤드레스트(FLAT). 활성 타겟 근육: 심부 코어 (복횡근·다열근·골반저근)(주동근 (주 타겟)), 광배근·전거근·하부승모근 (견갑 안정)(주동근 (주 타겟)), 복직근·내외복사근 (전측면 코어)(안정화근 (코어·정렬 유지)), 척추기립근·흉추 신전근 (후면 척추)(신장·이완 부위). 앱 자체 제작 다관절 키네마틱 도해 (Original Free-License Kinematic SVG v1 · 외부 저작권 무관)</desc><defs><linearGradient id="mpd-bg-_R_0_" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="200"><stop offset="0%" stop-color="#faf9f5"></stop><stop offset="68%" stop-color="#f0f1eb"></stop><stop offset="100%" stop-color="#e5e9e1"></stop></linearGradient><linearGradient id="mpd-oak-_R_0_" gradientUnits="userSpaceOnUse" x1="0" y1="100" x2="0" y2="180"><stop offset="0%" stop-color="#ead8b8"></stop><stop offset="48%" stop-color="#cfae82"></stop><stop offset="100%" stop-color="#ac875b"></stop></linearGradient><linearGradient id="mpd-upholstery-_R_0_" x1="0" y1="0" x2="0.2" y2="1"><stop offset="0%" stop-color="#8b9f8c"></stop><stop offset="32%" stop-color="#637e68"></stop><stop offset="100%" stop-color="#405c48"></stop></linearGradient><linearGradient id="mpd-tors