<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" role="img" aria-labelledby="mpd-title-_R_0_" aria-describedby="mpd-desc-_R_0_" class="movement-phase-diagram-svg" data-exercise-id="original-barrel-standing-rotation" data-phase="end" data-archetype-id="barrel-standing-rotation-isolated" data-apparatus="barrel" data-body-position="standing" data-active-side="right" data-view-mirrored="false" data-production-method="free-authored-kinematic-svg-v1" data-anatomical-accuracy-assumed="false" data-visual-theme="studio" data-material-system="atelier-v2" data-detail-level="preview" style="width:100%;height:auto;display:block;aspect-ratio:8 / 5;border-radius:10px"><title id="mpd-title-_R_0_">래더 지지 몸통 회전 · 마무리 자세 · 계획용 동작 도해</title><desc id="mpd-desc-_R_0_">까치발 상승 없이 발바닥 접지를 유지하며 가슴과 팔(hand: 100,76)이 정면으로 돌아옵니다. (해부학적 실측 아님) (주의: 강사 검토 전 계획 자료입니다. 바렐과 래더의 고정·간격·접촉면을 확인합니다. 올라가고 내려오는 방법과 지지 위치는 강사가 정합니다. 통증이나 불편이 생기면 동작을 멈추고 강사와 구성을 조정합니다.) 호흡 큐: 들숨: 키가 작아지지 않게 버티며 뒤꿈치 천천히 착지. 지지면: 바렐 스탠딩 (선 자세). 활성 타겟 근육: 척추기립근·흉추 신전근 (후면 척추)(주동근 (주 타겟)), 심부 코어 (복횡근·다열근·골반저근)(안정화근 (코어·정렬 유지)), 장요근·고관절 굴곡근 (전면 고관절)(신장·이완 부위). 앱 자체 제작 다관절 키네마틱 도해 (Original Free-License Kinematic SVG v1 · 외부 저작권 무관)</desc><defs><linearGradient id="mpd-bg-_R_0_" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="200"><stop offset="0%" stop-color="#faf9f5"></stop><stop offset="68%" stop-color="#f0f1eb"></stop><stop offset="100%" stop-color="#e5e9e1"></stop></linearGradient><linearGradient id="mpd-oak-_R_0_" gradientUnits="userSpaceOnUse" x1="0" y1="100" x2="0" y2="180"><stop offset="0%" stop-color="#ead8b8"></stop><stop offset="48%" stop-color="#cfae82"></stop><stop offset="100%" stop-color="#ac875b"></stop></linearGradient><linearGradient id="mpd-upholstery-_R_0_" x1="0" y1="0" x2="0.2" y2="1"><stop offset="0%" stop-color="#8b9f8c"></stop><stop offset="32%" stop-color="#637e68"></stop><stop offset="100%" stop-color="#405c48">