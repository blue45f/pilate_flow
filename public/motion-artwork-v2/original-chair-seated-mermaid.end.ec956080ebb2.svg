<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" role="img" aria-labelledby="mpd-title-_R_0_" aria-describedby="mpd-desc-_R_0_" class="movement-phase-diagram-svg" data-exercise-id="original-chair-seated-mermaid" data-phase="end" data-archetype-id="chair-seated-mermaid-isolated" data-apparatus="chair" data-body-position="seated" data-active-side="right" data-view-mirrored="false" data-production-method="free-authored-kinematic-svg-v1" data-anatomical-accuracy-assumed="false" data-visual-theme="studio" data-material-system="atelier-v2" data-detail-level="preview" style="width:100%;height:auto;display:block;aspect-ratio:8 / 5;border-radius:10px"><title id="mpd-title-_R_0_">체어 시티드 머메이드 · 마무리 자세 · 계획용 동작 도해</title><desc id="mpd-desc-_R_0_">늘어난 옆구리(외복사근·요방형근) 힘으로 아래쪽 갈비뼈부터 차곡차곡 쌓아 수직 정렬로 돌아옵니다. (주의: 강사 검토 전 계획 자료입니다. 체어의 고정과 페달·핸들·스프링을 점검합니다. 승하차와 페달 복귀는 강사가 보조하고 장력은 직접 설정합니다. 통증이나 불편이 생기면 동작을 멈추고 강사와 구성을 조정합니다.) 호흡 큐: 날숨: 반대쪽 옆구리 힘으로 골반 위에 흉곽을 다시 수직 적층. 지지면: 운다 체어 시티드 (앉은 자세). 활성 타겟 근육: 복직근·내외복사근 (전측면 코어)(주동근 (주 타겟)), 심부 코어 (복횡근·다열근·골반저근)(안정화근 (코어·정렬 유지)), 척추기립근·흉추 신전근 (후면 척추)(신장·이완 부위). 앱 자체 제작 다관절 키네마틱 도해 (Original Free-License Kinematic SVG v1 · 외부 저작권 무관)</desc><defs><linearGradient id="mpd-bg-_R_0_" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="200"><stop offset="0%" stop-color="#faf9f5"></stop><stop offset="68%" stop-color="#f0f1eb"></stop><stop offset="100%" stop-color="#e5e9e1"></stop></linearGradient><linearGradient id="mpd-oak-_R_0_" gradientUnits="userSpaceOnUse" x1="0" y1="100" x2="0" y2="180"><stop offset="0%" stop-color="#ead8b8"></stop><stop offset="48%" stop-color="#cfae82"></stop><stop offset="100%" stop-color="#ac875b"></stop></linearGradient><linearGradient id="mpd-upholstery-_R_0_" x1="0" y1="0" x2="0.2" y2="1"><stop offset="0%" stop-color="#8b9f8c"></stop><stop offset="32%" stop-color="#637e68"></stop><stop offset="100%" stop-color="#405c48"></stop></linea