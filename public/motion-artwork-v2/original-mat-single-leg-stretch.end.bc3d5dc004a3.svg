<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" role="img" aria-labelledby="mpd-title-_R_0_" aria-describedby="mpd-desc-_R_0_" class="movement-phase-diagram-svg" data-exercise-id="original-mat-single-leg-stretch" data-phase="end" data-archetype-id="supine-leg-stretch-hundred" data-apparatus="mat" data-body-position="supine" data-active-side="right" data-view-mirrored="false" data-production-method="free-authored-kinematic-svg-v1" data-anatomical-accuracy-assumed="false" data-visual-theme="studio" data-material-system="atelier-v2" data-detail-level="preview" style="width:100%;height:auto;display:block;aspect-ratio:8 / 5;border-radius:10px"><title id="mpd-title-_R_0_">싱글 레그 스트레치 준비 · 교대 연결 자세 · 계획용 동작 도해</title><desc id="mpd-desc-_R_0_">반대쪽(좌측) 무릎을 가슴으로 당겨 양손 정강이 그립을 완성하고 우측 다리를 45° 사선(78° 시저 스플릿)으로 길게 뻗어냅니다. 호흡 큐: 날숨 2: 좌측 무릎 정강이 그립 &amp; 우측 다리 45° 사선 신전. 지지면: 매트 수파인 지지면 (요추·천골 임프린트 y=143..144). 활성 타겟 근육: 복직근·내외복사근 (상복부 컬업 &amp; 갈비뼈 닫기)(주동근 (주 타겟)), 심부 코어 (복횡근·다열근·골반저근)(안정화근 (코어·정렬 유지)), 장요근·대퇴사두근 (45° 사선 하지 지지 &amp; 시저 교차)(주동근 (주 타겟)), 햄스트링·둔부 후면 사슬 (교차 신장)(신장·이완 부위). 앱 자체 제작 다관절 키네마틱 도해 (Original Free-License Kinematic SVG v1 · 외부 저작권 무관)</desc><defs><linearGradient id="mpd-bg-_R_0_" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="200"><stop offset="0%" stop-color="#faf9f5"></stop><stop offset="68%" stop-color="#f0f1eb"></stop><stop offset="100%" stop-color="#e5e9e1"></stop></linearGradient><linearGradient id="mpd-oak-_R_0_" gradientUnits="userSpaceOnUse" x1="0" y1="100" x2="0" y2="180"><stop offset="0%" stop-color="#ead8b8"></stop><stop offset="48%" stop-color="#cfae82"></stop><stop offset="100%" stop-color="#ac875b"></stop></linearGradient><linearGradient id="mpd-upholstery-_R_0_" x1="0" y1="0" x2="0.2" y2="1"><stop offset="0%" stop-color="#8b9f8c"></stop><stop offset="32%" stop-color="#637e68"></stop><stop offset="100%" stop-color="#405c48"></stop></linearGradient><lin