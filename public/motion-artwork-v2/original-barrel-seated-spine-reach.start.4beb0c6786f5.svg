<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" role="img" aria-labelledby="mpd-title-_R_0_" aria-describedby="mpd-desc-_R_0_" class="movement-phase-diagram-svg" data-exercise-id="original-barrel-seated-spine-reach" data-phase="start" data-archetype-id="seated-roll-back-spine-twist" data-apparatus="barrel" data-body-position="seated" data-active-side="right" data-view-mirrored="false" data-production-method="free-authored-kinematic-svg-v1" data-anatomical-accuracy-assumed="false" data-visual-theme="studio" data-material-system="atelier-v2" data-detail-level="preview" style="width:100%;height:auto;display:block;aspect-ratio:8 / 5;border-radius:10px"><title id="mpd-title-_R_0_">바렐 시티드 스파인 리치 · 시작 자세 · 계획용 동작 도해</title><desc id="mpd-desc-_R_0_">매트(y=144) 위에 다리를 뻗어 발목을 당기고(배측굴곡), 천골(S1)부터 경추(C7)까지 6개 척추 분절을 가상 수직벽(x=58)에 일직선으로 세운 뒤 양팔을 어깨높이(y=56)로 뻗습니다. 호흡 큐: 코로 깊게 마시며 좌골로 매트를 누르고 정수리를 가상 벽을 따라 천장으로 끌어올립니다.. 지지면: 필라테스 매트(y=144) + 가상 수직벽 플럼라인(x=58). 활성 타겟 근육: 전거근 · 하부승모근 (견갑 안정화)(안정화근 (코어·정렬 유지)). 앱 자체 제작 2D 키네마틱 도해 (자유 라이선스 · 외부 프레임 무차용)</desc><defs><linearGradient id="mpd-bg-_R_0_" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="200"><stop offset="0%" stop-color="#faf9f5"></stop><stop offset="68%" stop-color="#f0f1eb"></stop><stop offset="100%" stop-color="#e5e9e1"></stop></linearGradient><linearGradient id="mpd-oak-_R_0_" gradientUnits="userSpaceOnUse" x1="0" y1="100" x2="0" y2="180"><stop offset="0%" stop-color="#ead8b8"></stop><stop offset="48%" stop-color="#cfae82"></stop><stop offset="100%" stop-color="#ac875b"></stop></linearGradient><linearGradient id="mpd-upholstery-_R_0_" x1="0" y1="0" x2="0.2" y2="1"><stop offset="0%" stop-color="#8b9f8c"></stop><stop offset="32%" stop-color="#637e68"></stop><stop offset="100%" stop-color="#405c48"></stop></linearGradient><linearGradient id="mpd-torso-_R_0_" x1="0.05" y1="0" x2="0.9" y2="0.9"><stop offset="0%" stop-color="#789785"><