<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" role="img" aria-labelledby="mpd-title-_R_0_" aria-describedby="mpd-desc-_R_0_" class="movement-phase-diagram-svg" data-exercise-id="original-chair-sit-to-stand" data-phase="end" data-archetype-id="chair-sit-to-stand-isolated" data-apparatus="chair" data-body-position="standing" data-active-side="right" data-view-mirrored="false" data-production-method="free-authored-kinematic-svg-v1" data-anatomical-accuracy-assumed="false" data-visual-theme="studio" data-material-system="atelier-v2" data-detail-level="preview" style="width:100%;height:auto;display:block;aspect-ratio:8 / 5;border-radius:10px"><title id="mpd-title-_R_0_">체어 앉았다 일어서기 · 복귀 자세 · 계획용 동작 도해</title><desc id="mpd-desc-_R_0_">엉덩이를 뒤·아래로 천천히 보내며 체어 시트 좌면(pelvis: 142,106)으로 안전하게 앉아 복귀합니다. (해부학적 실측 아님) (주의: 강사 검토 전 계획 자료입니다. 체어의 고정과 페달·핸들·스프링을 점검합니다. 승하차와 페달 복귀는 강사가 보조하고 장력은 직접 설정합니다. 체어가 밀리지 않도록 고정하고 필요한 경우 강사의 지지를 받습니다.) 호흡 큐: 들숨: 골반 수평을 지키며 천천히 홈 방향으로 복귀. 지지면: 운다 체어 스탠딩 (선 자세). 활성 타겟 근육: 대둔근 (후면 고관절 신전)(주동근 (주 타겟)), 대퇴사두근 (슬관절 신전·지지)(안정화근 (코어·정렬 유지)), 장요근·고관절 굴곡근 (전면 고관절)(신장·이완 부위). 앱 자체 제작 다관절 키네마틱 도해 (Original Free-License Kinematic SVG v1 · 외부 저작권 무관)</desc><defs><linearGradient id="mpd-bg-_R_0_" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="200"><stop offset="0%" stop-color="#faf9f5"></stop><stop offset="68%" stop-color="#f0f1eb"></stop><stop offset="100%" stop-color="#e5e9e1"></stop></linearGradient><linearGradient id="mpd-oak-_R_0_" gradientUnits="userSpaceOnUse" x1="0" y1="100" x2="0" y2="180"><stop offset="0%" stop-color="#ead8b8"></stop><stop offset="48%" stop-color="#cfae82"></stop><stop offset="100%" stop-color="#ac875b"></stop></linearGradient><linearGradient id="mpd-upholstery-_R_0_" x1="0" y1="0" x2="0.2" y2="1"><stop offset="0%" stop-color="#8b9f8c"></stop><stop offset="32%" stop-color="#637e68"></stop><stop offset="100%" stop-color="#405c48"></stop><