<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" role="img" aria-labelledby="mpd-title-_R_0_" aria-describedby="mpd-desc-_R_0_" class="movement-phase-diagram-svg" data-exercise-id="original-barrel-standing-side-stretch" data-phase="middle" data-archetype-id="barrel-standing-side-stretch-isolated" data-apparatus="barrel" data-body-position="standing" data-active-side="right" data-view-mirrored="false" data-production-method="free-authored-kinematic-svg-v1" data-anatomical-accuracy-assumed="false" data-visual-theme="studio" data-material-system="atelier-v2" data-detail-level="preview" style="width:100%;height:auto;display:block;aspect-ratio:8 / 5;border-radius:10px"><title id="mpd-title-_R_0_">바렐 스탠딩 사이드 리치 · 정점 자세 · 계획용 동작 도해</title><desc id="mpd-desc-_R_0_">양발(ankle: 148,170)로 바닥에 서서 골반(148,122)을 고정한 채 반대 팔(hand: 180,22→88,24)과 흉곽을 바렐 쪽으로 길게 측굴합니다. (바닥에서 고정된 지지를 잡고 반대 팔을 위로 길게 보내 작은 측굴을 탐색합니다.) 호흡 큐: 들숨/날숨: 열린 쪽 늑간근(갈비뼈 사이)으로 깊은 호흡 불어넣기. 지지면: 바렐 스탠딩 (선 자세). 활성 타겟 근육: 복직근·내외복사근 (전측면 코어)(주동근 (주 타겟)), 광배근·전거근·하부승모근 (견갑 안정)(주동근 (주 타겟)), 심부 코어 (복횡근·다열근·골반저근)(안정화근 (코어·정렬 유지)), 척추기립근·흉추 신전근 (후면 척추)(신장·이완 부위). 앱 자체 제작 다관절 키네마틱 도해 (Original Free-License Kinematic SVG v1 · 외부 저작권 무관)</desc><defs><linearGradient id="mpd-bg-_R_0_" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="200"><stop offset="0%" stop-color="#faf9f5"></stop><stop offset="68%" stop-color="#f0f1eb"></stop><stop offset="100%" stop-color="#e5e9e1"></stop></linearGradient><linearGradient id="mpd-oak-_R_0_" gradientUnits="userSpaceOnUse" x1="0" y1="100" x2="0" y2="180"><stop offset="0%" stop-color="#ead8b8"></stop><stop offset="48%" stop-color="#cfae82"></stop><stop offset="100%" stop-color="#ac875b"></stop></linearGradient><linearGradient id="mpd-upholstery-_R_0_" x1="0" y1="0" x2="0.2" y2="1"><stop offset="0%" stop-color="#8b9f8c"></stop><stop offset="32%" stop-color="#637e68"></stop><stop offset="100%" stop-color="#40