<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" role="img" aria-labelledby="mpd-title-_R_0_" aria-describedby="mpd-desc-_R_0_" class="movement-phase-diagram-svg" data-exercise-id="original-mat-swimming-prep" data-phase="middle" data-archetype-id="mat-swimming-contralateral-prep" data-apparatus="mat" data-body-position="prone" data-active-side="right" data-view-mirrored="false" data-production-method="free-authored-kinematic-svg-v1" data-anatomical-accuracy-assumed="false" data-visual-theme="studio" data-material-system="atelier-v2" data-detail-level="preview" style="width:100%;height:auto;display:block;aspect-ratio:8 / 5;border-radius:10px"><title id="mpd-title-_R_0_">스위밍 준비 · 정점 자세 · 계획용 동작 도해</title><desc id="mpd-desc-_R_0_">몸통을 유지하고 한쪽 팔과 반대쪽 다리를 멀리 뻗습니다. 팔로 바닥을 밀어 상체를 세우는 동작과 구분합니다. (팔 또는 다리를 하나씩 길게 뻗으며 몸통이 좌우로 흔들리는지 살펴봅니다.) 호흡 큐: 들숨(또는 날숨): 가슴을 앞·위로 열며 긴 활 모양 스완 신전. 지지면: 매트 프론 (엎드린 자세). 활성 타겟 근육: 척추기립근·흉추 신전근 (후면 척추)(주동근 (주 타겟)), 대둔근 (후면 고관절 신전)(주동근 (주 타겟)), 심부 코어 (복횡근·다열근·골반저근)(안정화근 (코어·정렬 유지)), 복직근·내외복사근 (전측면 코어)(신장·이완 부위). 앱 자체 제작 다관절 키네마틱 도해 (Original Free-License Kinematic SVG v1 · 외부 저작권 무관)</desc><defs><linearGradient id="mpd-bg-_R_0_" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="200"><stop offset="0%" stop-color="#faf9f5"></stop><stop offset="68%" stop-color="#f0f1eb"></stop><stop offset="100%" stop-color="#e5e9e1"></stop></linearGradient><linearGradient id="mpd-oak-_R_0_" gradientUnits="userSpaceOnUse" x1="0" y1="100" x2="0" y2="180"><stop offset="0%" stop-color="#ead8b8"></stop><stop offset="48%" stop-color="#cfae82"></stop><stop offset="100%" stop-color="#ac875b"></stop></linearGradient><linearGradient id="mpd-upholstery-_R_0_" x1="0" y1="0" x2="0.2" y2="1"><stop offset="0%" stop-color="#8b9f8c"></stop><stop offset="32%" stop-color="#637e68"></stop><stop offset="100%" stop-color="#405c48"></stop></linearGradient><linearGradient id="mpd-torso-_R_0_" x1="0