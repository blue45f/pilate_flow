<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" role="img" aria-labelledby="mpd-title-_R_0_" aria-describedby="mpd-desc-_R_0_" class="movement-phase-diagram-svg" data-exercise-id="original-cadillac-arm-spring-press" data-phase="end" data-archetype-id="supine-strap-arm-press" data-apparatus="cadillac" data-body-position="supine" data-active-side="right" data-view-mirrored="false" data-production-method="free-authored-kinematic-svg-v1" data-anatomical-accuracy-assumed="false" data-visual-theme="studio" data-material-system="atelier-v2" data-detail-level="preview" style="width:100%;height:auto;display:block;aspect-ratio:8 / 5;border-radius:10px"><title id="mpd-title-_R_0_">누워서 암 스프링 프레스 · 마무리 자세 · 계획용 동작 도해</title><desc id="mpd-desc-_R_0_">스프링 장력에 어깨가 귀 쪽으로 끌려가지 않도록 저항하며 천천히 시작 각도로 돌아옵니다. (주의: 강사 검토 전 계획 자료입니다. 바·스프링·클립·안전 스트랩을 제조사 지침에 따라 점검합니다. 바의 이동 범위와 보조 위치는 강사가 결정합니다. 클립·스프링 위치를 점검하고 얼굴 위로 손잡이를 지나가게 하지 않습니다.) 호흡 큐: 들숨: 겨드랑이 텐션을 유지하며 어깨 수직선까지만 천천히 복귀. 지지면: 캐딜락 수파인 (누운 자세). 활성 타겟 근육: 삼각근·상완이두/삼두근 (상지 주동)(주동근 (주 타겟)), 심부 코어 (복횡근·다열근·골반저근)(안정화근 (코어·정렬 유지)), 척추기립근·흉추 신전근 (후면 척추)(신장·이완 부위). 앱 자체 제작 다관절 키네마틱 도해 (Original Free-License Kinematic SVG v1 · 외부 저작권 무관)</desc><defs><linearGradient id="mpd-bg-_R_0_" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="200"><stop offset="0%" stop-color="#faf9f5"></stop><stop offset="68%" stop-color="#f0f1eb"></stop><stop offset="100%" stop-color="#e5e9e1"></stop></linearGradient><linearGradient id="mpd-oak-_R_0_" gradientUnits="userSpaceOnUse" x1="0" y1="100" x2="0" y2="180"><stop offset="0%" stop-color="#ead8b8"></stop><stop offset="48%" stop-color="#cfae82"></stop><stop offset="100%" stop-color="#ac875b"></stop></linearGradient><linearGradient id="mpd-upholstery-_R_0_" x1="0" y1="0" x2="0.2" y2="1"><stop offset="0%" stop-color="#8b9f8c"></stop><stop offset="32%" stop-color="#637e68"></stop><stop offset="100%" stop-color="#405c48"></stop></