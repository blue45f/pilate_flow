<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" role="img" aria-labelledby="mpd-title-_R_0_" aria-describedby="mpd-desc-_R_0_" class="movement-phase-diagram-svg" data-exercise-id="ex-plank-01" data-phase="middle" data-archetype-id="reformer-plank-long-stretch-isolated" data-apparatus="reformer" data-body-position="quadruped" data-active-side="right" data-view-mirrored="false" data-production-method="free-authored-kinematic-svg-v1" data-anatomical-accuracy-assumed="false" data-visual-theme="studio" data-material-system="atelier-v2" data-detail-level="preview" style="width:100%;height:auto;display:block;aspect-ratio:8 / 5;border-radius:10px"><title id="mpd-title-_R_0_">리포머 롱 스트레치 &amp; 엘리펀트 / 니 스트레치 · 정점 자세 · 계획용 동작 도해</title><desc id="mpd-desc-_R_0_">다리가 아닌 명치와 하복부를 천장 쪽으로 끌어올리는 힘으로 골반을 높게 세우며 캐리지/페달을 끌어당깁니다. (스프링 1R 1B에서 롱 스트레치 6회 + 업 스트레치 6회 + 엘리펀트 8회) 호흡 큐: 들쉬며 플랭크 라인 그대로 어깨가 손목 뒤로 이동. 지지면: 리포머 쿼드러페드 (네발기기) · 풋바(HIGH) · 헤드레스트(UP). 활성 타겟 근육: 심부 코어 (복횡근·다열근·골반저근)(주동근 (주 타겟)), 광배근·전거근·하부승모근 (견갑 안정)(주동근 (주 타겟)), 복직근·내외복사근 (전측면 코어)(안정화근 (코어·정렬 유지)), 햄스트링 (슬관절 굴곡·후면 사슬)(신장·이완 부위). 앱 자체 제작 다관절 키네마틱 도해 (Original Free-License Kinematic SVG v1 · 외부 저작권 무관)</desc><defs><linearGradient id="mpd-bg-_R_0_" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="200"><stop offset="0%" stop-color="#faf9f5"></stop><stop offset="68%" stop-color="#f0f1eb"></stop><stop offset="100%" stop-color="#e5e9e1"></stop></linearGradient><linearGradient id="mpd-oak-_R_0_" gradientUnits="userSpaceOnUse" x1="0" y1="100" x2="0" y2="180"><stop offset="0%" stop-color="#ead8b8"></stop><stop offset="48%" stop-color="#cfae82"></stop><stop offset="100%" stop-color="#ac875b"></stop></linearGradient><linearGradient id="mpd-upholstery-_R_0_" x1="0" y1="0" x2="0.2" y2="1"><stop offset="0%" stop-color="#8b9f8c"></stop><stop offset="32%" stop-color="#637e68"></stop><stop offset="100%" stop-color="#405c48"></stop></linearGrad