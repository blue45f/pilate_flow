<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" role="img" aria-labelledby="mpd-title-_R_0_" aria-describedby="mpd-desc-_R_0_" class="movement-phase-diagram-svg" data-exercise-id="ex-bridging-02" data-phase="middle" data-archetype-id="supine-articulated-bridge" data-apparatus="cadillac" data-body-position="supine" data-active-side="right" data-view-mirrored="false" data-production-method="free-authored-kinematic-svg-v1" data-anatomical-accuracy-assumed="false" data-visual-theme="studio" data-material-system="atelier-v2" data-detail-level="preview" style="width:100%;height:auto;display:block;aspect-ratio:8 / 5;border-radius:10px"><title id="mpd-title-_R_0_">캐딜락 타워 바 파라키트 &amp; 숄더 브릿지 · 정점 자세 · 계획용 동작 도해</title><desc id="mpd-desc-_R_0_">타워바가 흔들리지 않게 둔근·햄스트링으로 바(ankle: 244,82)를 수직 지지하며 꼬리뼈부터 분절 거상하여 어깨(90,140)-고관절(182,87)-무릎(218,66)의 높은 사선(30.0°)을 만듭니다. 호흡 큐: 날숨: 타워바를 발아치로 밀어 올리며 30° 고사선 브리지 정점 유지. 지지면: 캐딜락 테이블 매트(y:143) · 하단 스프링 + 안전 스트랩 경사 타워바 지지. 활성 타겟 근육: 대둔근 (후면 고관절 신전)(주동근 (주 타겟)), 햄스트링 (슬관절 굴곡·후면 사슬)(주동근 (주 타겟)), 심부 코어 (복횡근·다열근·골반저근)(안정화근 (코어·정렬 유지)), 장요근·고관절 굴곡근 (전면 고관절)(신장·이완 부위). 앱 자체 제작 다관절 키네마틱 도해 (Original Free-License Kinematic SVG v1 · 외부 저작권 무관 · 해부학 미검증)</desc><defs><linearGradient id="mpd-bg-_R_0_" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="200"><stop offset="0%" stop-color="#faf9f5"></stop><stop offset="68%" stop-color="#f0f1eb"></stop><stop offset="100%" stop-color="#e5e9e1"></stop></linearGradient><linearGradient id="mpd-oak-_R_0_" gradientUnits="userSpaceOnUse" x1="0" y1="100" x2="0" y2="180"><stop offset="0%" stop-color="#ead8b8"></stop><stop offset="48%" stop-color="#cfae82"></stop><stop offset="100%" stop-color="#ac875b"></stop></linearGradient><linearGradient id="mpd-upholstery-_R_0_" x1="0" y1="0" x2="0.2" y2="1"><stop offset="0%" stop-color="#8b9f8c"></stop><stop offset="32%" stop-color="#637e68"></stop><stop offset="100%" stop-color="#405c48"