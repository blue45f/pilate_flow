name: Tracked-file secret check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Test and run the tracked-file check
        run: node --test scripts/check-secrets.node-test.mjs && node scripts/check-secrets.mjs
