name: Deploy Production (GitHub Pages & Firebase Hosting)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "production-deploy-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Quality Gate & Production PWA Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run secrets & motion-study guard
        run: pnpm check:secrets && pnpm check:motion-study

      - name: Build production PWA bundle
        run: pnpm build

      - name: Upload production dist artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy-github-pages:
    name: Deploy to GitHub Pages
    needs: verify-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
