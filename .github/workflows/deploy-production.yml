name: Dynamic Multi-Cloud & Local Artifact Production Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_target:
        description: "배포 대상 환경 선택 (all | github-pages | firebase | cloudflare | vercel | netlify)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - github-pages
          - firebase
          - cloudflare
          - vercel
          - netlify

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "production-deploy-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Quality Gate & Universal PWA Bundle
    runs-on: ubuntu-latest
    outputs:
      target: ${{ inputs.deploy_target || 'all' }}
    steps:
      - name: Checkout repository (main)
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run secrets & motion-study guard
        run: pnpm check:secrets && pnpm check:motion-study

      - name: Run Wave 3-7 advancement & multi-cloud verification suites
        run: pnpm vitest run src/test/wave3AdvancementVerification.test.ts src/test/wave4FollowthroughVerification.test.ts src/test/wave5AdvancementVerification.test.ts src/test/wave6AdvancementVerification.test.ts src/test/wave7MultiCloudDeployVerification.test.ts src/utils/wave3DeploymentRegression.test.ts src/utils/wave5DeploymentRegression.test.ts

      - name: Build production PWA bundle & verify multi-cloud configs
        run: pnpm build && node scripts/deploy-universal.mjs --check-env

      - name: Upload portable static bundle (for local/Docker/custom cloud)
        uses: actions/upload-artifact@v4
        with:
          name: pilates-flow-production-dist
          path: ./dist
          retention-days: 14

      - name: Configure GitHub Pages
        id: pages_config
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy-github-pages:
    name: Deploy -> GitHub Pages
    needs: verify-and-build
    if: ${{ always() && needs.verify-and-build.result == 'success' && (needs.verify-and-build.outputs.target == 'all' || needs.verify-and-build.outputs.target == 'github-pages') }}
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-firebase-hosting:
    name: Deploy -> Firebase Hosting (pilates-flow-atelier)
    needs: verify-and-build
    if: ${{ always() && needs.verify-and-build.result == 'success' && (needs.verify-and-build.outputs.target == 'all' || needs.verify-and-build.outputs.target == 'firebase') }}
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
    steps:
      - name: Checkout repository config
        uses: actions/checkout@v4

      - name: Download verified production dist
        uses: actions/download-artifact@v4
        with:
          name: pilates-flow-production-dist
          path: ./dist

      - name: Deploy to Firebase Hosting (when credentials configured)
        run: |
          if [ -n "$FIREBASE_TOKEN" ]; then
            npx --yes firebase-tools deploy --only hosting:pilates-flow-atelier --project deskcloud-fleet-auth --token "$FIREBASE_TOKEN"
          elif [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "$FIREBASE_SERVICE_ACCOUNT" > /tmp/gcp-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS="/tmp/gcp-sa.json"
            npx --yes firebase-tools deploy --only hosting:pilates-flow-atelier --project deskcloud-fleet-auth
            rm -f /tmp/gcp-sa.json
          else
            echo "::notice::FIREBASE_TOKEN or FIREBASE_SERVICE_ACCOUNT secret not set in GitHub Actions; use local 'pnpm deploy:parallel' or add secret for CI auto-deploy."
          fi

  deploy-cloudflare-pages:
    name: Deploy -> Cloudflare Pages
    needs: verify-and-build
    if: ${{ always() && needs.verify-and-build.result == 'success' && (needs.verify-and-build.outputs.target == 'all' || needs.verify-and-build.outputs.target == 'cloudflare') }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Download verified production dist
        uses: actions/download-artifact@v4
        with:
          name: pilates-flow-production-dist
          path: ./dist

      - name: Deploy to Cloudflare Pages (when credentials configured)
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            npx --yes wrangler pages deploy ./dist --project-name=pilates-flow-atelier
          else
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not configured; skipping Cloudflare Pages deploy."
          fi

  deploy-vercel-and-netlify:
    name: Deploy -> Vercel & Netlify Edge
    needs: verify-and-build
    if: ${{ always() && needs.verify-and-build.result == 'success' && (needs.verify-and-build.outputs.target == 'all' || needs.verify-and-build.outputs.target == 'vercel' || needs.verify-and-build.outputs.target == 'netlify') }}
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      - name: Checkout repository config
        uses: actions/checkout@v4

      - name: Download verified production dist
        uses: actions/download-artifact@v4
        with:
          name: pilates-flow-production-dist
          path: ./dist

      - name: Deploy to Vercel / Netlify (when credentials configured)
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            npx --yes vercel deploy --prod --yes --token "$VERCEL_TOKEN"
          else
            echo "::notice::VERCEL_TOKEN not configured; skipping Vercel deploy."
          fi
          if [ -n "$NETLIFY_AUTH_TOKEN" ] && [ -n "$NETLIFY_SITE_ID" ]; then
            npx --yes netlify-cli deploy --prod --dir=./dist --auth "$NETLIFY_AUTH_TOKEN" --site "$NETLIFY_SITE_ID"
          else
            echo "::notice::NETLIFY_AUTH_TOKEN not configured; skipping Netlify deploy."
          fi
