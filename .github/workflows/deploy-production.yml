name: Production Deployment (Firebase Hosting · pilates-flow-atelier)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    name: Verify Quality Gate & Build Production PWA Artifact
    runs-on: ubuntu-latest
    concurrency:
      group: "production-build-${{ github.ref }}"
      cancel-in-progress: true
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run secrets, motion-study & deployment orchestrator unit guards
        run: pnpm check:secrets && pnpm check:motion-study && pnpm test:deploy

      - name: Run ESLint check
        run: pnpm lint

      - name: Run verification & deployment regression suites
        run: pnpm vitest run src/test/uxRedesignAndOpenAi.test.tsx src/test/wave3AdvancementVerification.test.ts src/test/wave4FollowthroughVerification.test.ts src/test/wave5AdvancementVerification.test.ts src/test/wave6AdvancementVerification.test.ts src/test/wave7MultiCloudDeployVerification.test.ts src/test/wave8SkillsAdvancementVerification.test.ts src/utils/wave3DeploymentRegression.test.ts src/utils/wave5DeploymentRegression.test.ts

      - name: Build production PWA bundle & verify canonical config
        run: pnpm build && pnpm deploy:check

      - name: Upload verified production dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: pilates-flow-atelier-dist
          path: ./dist
          if-no-files-found: error
          retention-days: 14

  deploy-hosting:
    name: Deploy to Firebase Hosting (pilates-flow-atelier) & Verify Live Hash
    needs: verify-and-build
    runs-on: ubuntu-latest
    concurrency:
      group: "production-hosting-deploy-${{ github.ref }}"
      cancel-in-progress: false
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
    steps:
      - name: Checkout deployment verification scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download verified production dist artifact
        uses: actions/download-artifact@v4
        with:
          name: pilates-flow-atelier-dist
          path: ./dist

      - name: Re-verify downloaded dist artifact integrity
        run: node scripts/check-pwa-build.mjs

      - name: Deploy to Firebase Hosting & strictly verify live bundle hash + 4 V2 assets
        run: |
          set -euo pipefail
          GAC_FILE=""
          cleanup() {
            if [ -n "$GAC_FILE" ] && [ -f "$GAC_FILE" ]; then
              rm -f "$GAC_FILE"
            fi
          }
          trap cleanup EXIT

          if [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            GAC_FILE="$(mktemp)"
            chmod 600 "$GAC_FILE"
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$GAC_FILE"
            export GOOGLE_APPLICATION_CREDENTIALS="$GAC_FILE"
            unset FIREBASE_TOKEN
            npx --yes firebase-tools@13.29.1 deploy --only hosting:pilates-flow-atelier --project deskcloud-fleet-auth --non-interactive
          elif [ -n "${FIREBASE_TOKEN:-}" ]; then
            npx --yes firebase-tools@13.29.1 deploy --only hosting:pilates-flow-atelier --project deskcloud-fleet-auth --non-interactive
          else
            echo "::error::Missing Firebase deployment credentials. Configure FIREBASE_SERVICE_ACCOUNT or FIREBASE_TOKEN in GitHub Actions Secrets."
            echo "### ❌ Live Firebase Upload Failed (Missing GitHub Secret)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          node scripts/deploy-universal.mjs --verify-live
          echo "### ✅ Deployed & Verified on Firebase Hosting (\`https://pilates-flow-atelier.web.app\`)" >> "$GITHUB_STEP_SUMMARY"
