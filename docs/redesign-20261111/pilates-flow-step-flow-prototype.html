<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pilates Flow — 단계형(동선 분리) 인터랙티브 시안</title>
    <style>
      :root {
        --bg: #f7f5f0;
        --surface: #ffffff;
        --surface-soft: #f0ede4;
        --ink: #1b3129;
        --muted: #56685f;
        --primary: #1f4d3f;
        --primary-ink: #ffffff;
        --line: #dad5c8;
        --accent-red: #b8442a;
        --accent-blue: #2d668f;
        --radius: 18px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;
        background: var(--bg);
        color: var(--ink);
        line-height: 1.5;
        word-break: keep-all;
      }
      .shell {
        max-width: 960px;
        margin: 0 auto;
        padding: 24px 16px 72px;
      }
      .top-header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 20px;
      }
      .brand {
        font-weight: 800;
        font-size: 1.15rem;
        letter-spacing: -0.02em;
      }
      .brand small {
        display: block;
        font-weight: 500;
        font-size: 0.78rem;
        color: var(--muted);
      }
      .viewport-toggle {
        display: inline-flex;
        gap: 6px;
        background: var(--surface-soft);
        padding: 4px;
        border-radius: 999px;
      }
      .viewport-toggle button {
        min-height: 40px;
        border: 0;
        background: transparent;
        padding: 6px 14px;
        border-radius: 999px;
        font-weight: 700;
        color: var(--muted);
        cursor: pointer;
      }
      .viewport-toggle button[aria-pressed='true'] {
        background: var(--surface);
        color: var(--ink);
        box-shadow: 0 2px 6px rgba(27, 49, 41, 0.08);
      }
      .stepper {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 8px;
        margin-bottom: 20px;
      }
      .stepper button {
        min-height: 48px;
        border: 1px solid var(--line);
        background: var(--surface);
        border-radius: 14px;
        padding: 8px 10px;
        font-weight: 700;
        font-size: 0.86rem;
        color: var(--muted);
        cursor: pointer;
        text-align: left;
      }
      .stepper button[aria-current='step'] {
        border-color: var(--primary);
        background: var(--primary);
        color: var(--primary-ink);
      }
      .frame {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 24px;
        padding: 28px;
        box-shadow: 0 12px 32px rgba(27, 49, 41, 0.06);
        margin: 0 auto;
        transition: max-width 200ms ease;
      }
      .frame.is-mobile {
        max-width: 390px;
        padding: 20px 16px;
      }
      .step-kicker {
        display: inline-block;
        padding: 4px 10px;
        border-radius: 999px;
        background: var(--surface-soft);
        font-size: 0.78rem;
        font-weight: 700;
        color: var(--primary);
        margin-bottom: 8px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.55rem;
        letter-spacing: -0.02em;
      }
      .lead {
        margin: 0 0 22px;
        color: var(--muted);
        font-size: 0.95rem;
      }
      .choice-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 14px;
      }
      .choice-card {
        border: 1.5px solid var(--line);
        border-radius: var(--radius);
        padding: 20px;
        background: #fcfbf8;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 14px;
      }
      .choice-card.primary {
        border-color: var(--primary);
        background: #f2f7f4;
      }
      .chip-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 8px 0 18px;
      }
      .chip {
        min-height: 44px;
        min-width: 64px;
        padding: 8px 16px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: var(--surface);
        font-weight: 700;
        cursor: pointer;
      }
      .chip[aria-pressed='true'] {
        background: var(--primary);
        color: #fff;
        border-color: var(--primary);
      }
      .move-card {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 14px;
        margin-bottom: 10px;
      }
      .spring-pill {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 0.75rem;
        font-weight: 700;
      }
      .spring-red {
        background: #fde8e3;
        color: var(--accent-red);
      }
      .spring-blue {
        background: #e4f0f8;
        color: var(--accent-blue);
      }
      .stepper-inline {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .stepper-inline button {
        min-width: 44px;
        min-height: 44px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: var(--surface-soft);
        font-weight: 800;
        cursor: pointer;
      }
      .cta-bar {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin-top: 24px;
        padding-top: 16px;
        border-top: 1px solid var(--line);
      }
      .btn {
        min-height: 48px;
        padding: 10px 20px;
        border-radius: 14px;
        border: 1px solid var(--line);
        background: var(--surface);
        font-weight: 700;
        font-size: 0.95rem;
        cursor: pointer;
      }
      .btn-primary {
        background: var(--primary);
        border-color: var(--primary);
        color: #fff;
      }
      .timer-box {
        text-align: center;
        padding: 24px 16px;
        border-radius: 18px;
        background: #1a382e;
        color: #fff;
        margin-bottom: 14px;
      }
      .timer-digits {
        font-size: 3.4rem;
        font-weight: 800;
        letter-spacing: 0.02em;
      }
      .next-banner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 16px;
        border-radius: 14px;
        background: #eef4f0;
        border: 1px solid #bfd3c6;
      }
      @media (max-width: 640px) {
        .stepper {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="top-header">
        <div class="brand">
          Pilates Flow · 단계형 시퀀스 빌더 시안
          <small>한 페이지에는 꼭 필요한 한 가지 결정만 남깁니다</small>
        </div>
        <div class="viewport-toggle" role="group" aria-label="화면 크기 전환">
          <button type="button" id="vp-desktop" aria-pressed="true" onclick="setViewport('desktop')">
            데스크톱 · 태블릿
          </button>
          <button type="button" id="vp-mobile" aria-pressed="false" onclick="setViewport('mobile')">
            모바일 (390px)
          </button>
        </div>
      </header>

      <nav class="stepper" aria-label="수업 제작 단계">
        <button type="button" id="tab-0" aria-current="step" onclick="goStep(0)">시작하기</button>
        <button type="button" id="tab-1" onclick="goStep(1)">1. 수업 기본</button>
        <button type="button" id="tab-2" onclick="goStep(2)">2. 동작 담기</button>
        <button type="button" id="tab-3" onclick="goStep(3)">3. 순서·시간</button>
        <button type="button" id="tab-4" onclick="goStep(4)">4. 수업 진행</button>
      </nav>

      <main id="stage-frame" class="frame"></main>
    </div>

    <script>
      const state = {
        step: 0,
        minutes: 50,
        apparatus: '리포머',
        level: '초중급',
        items: [
          { name: '풋워크 패럴렐', springs: '빨강×2 · 파랑×1', min: 8 },
          { name: '펠빅 컬', springs: '빨강×2', min: 8 },
          { name: '헌드레드', springs: '빨강×1 · 파랑×1', min: 10 },
        ],
      };

      function setViewport(mode) {
        document.getElementById('vp-desktop').setAttribute('aria-pressed', String(mode === 'desktop'));
        document.getElementById('vp-mobile').setAttribute('aria-pressed', String(mode === 'mobile'));
        document.getElementById('stage-frame').classList.toggle('is-mobile', mode === 'mobile');
      }

      function goStep(n) {
        state.step = n;
        for (let i = 0; i <= 4; i++) {
          const btn = document.getElementById('tab-' + i);
          if (i === n) btn.setAttribute('aria-current', 'step');
          else btn.removeAttribute('aria-current');
        }
        render();
      }

      function render() {
        const el = document.getElementById('stage-frame');
        const totalMin = state.items.reduce((s, it) => s + it.min, 0);
        if (state.step === 0) {
          el.innerHTML = `
            <span class="step-kicker">시작 화면 · 복잡한 설정 없음</span>
            <h1>오늘 어떤 수업을 준비할까요?</h1>
            <p class="lead">자주 쓰는 두 가지 행동만 바로 앞에 두었습니다.</p>
            <div class="choice-grid">
              <div class="choice-card primary">
                <div>
                  <strong>+ 새 수업 만들기</strong>
                  <p style="color:#56685f;font-size:0.9rem;margin:6px 0 0;">시간과 기구만 고르고 차근차근 동작을 담습니다.</p>
                </div>
                <button class="btn btn-primary" onclick="goStep(1)">새 수업 시작하기 →</button>
              </div>
              <div class="choice-card">
                <div>
                  <strong>최근 수업 이어하기 · 복제</strong>
                  <p style="color:#56685f;font-size:0.9rem;margin:6px 0 0;">오전 리포머 코어반 (50분 · 6개 동작)</p>
                </div>
                <button class="btn" onclick="goStep(3)">사본으로 바로 열기 →</button>
              </div>
            </div>
          `;
          return;
        }
        if (state.step === 1) {
          el.innerHTML = `
            <span class="step-kicker">1 / 4 단계 · 수업 기본 정하기</span>
            <h1>어떤 수업을 진행하시나요?</h1>
            <p class="lead">기본값이 미리 선택되어 있어 바로 다음으로 넘어가도 됩니다.</p>
            <strong>1. 수업 시간</strong>
            <div class="chip-row">
              ${[30, 50, 60]
                .map(
                  (m) =>
                    `<button class="chip" aria-pressed="${state.minutes === m}" onclick="state.minutes=${m};render()">${m}분</button>`,
                )
                .join('')}
            </div>
            <strong>2. 사용 기구</strong>
            <div class="chip-row">
              ${['리포머', '매트', '체어', '캐딜락', '바렐']
                .map(
                  (g) =>
                    `<button class="chip" aria-pressed="${state.apparatus === g}" onclick="state.apparatus='${g}';render()">${g}</button>`,
                )
                .join('')}
            </div>
            <strong>3. 난이도</strong>
            <div class="chip-row">
              ${['입문·기초', '초중급', '중상급']
                .map(
                  (lv) =>
                    `<button class="chip" aria-pressed="${state.level === lv}" onclick="state.level='${lv}';render()">${lv}</button>`,
                )
                .join('')}
            </div>
            <div class="cta-bar">
              <button class="btn" onclick="goStep(0)">← 처음으로</button>
              <button class="btn btn-primary" onclick="goStep(2)">다음: 동작 담기 →</button>
            </div>
          `;
          return;
        }
        if (state.step === 2) {
          const catalog = [
            { name: '롱 박스 스완', springs: '빨강×1', min: 8 },
            { name: '피트 인 스트랩', springs: '빨강×2', min: 10 },
            { name: '머메이드 스트레치', springs: '파랑×1', min: 6 },
          ];
          el.innerHTML = `
            <span class="step-kicker">2 / 4 단계 · 동작 담기 (${state.apparatus} · ${state.minutes}분)</span>
            <h1>수업에 넣을 동작만 가볍게 담아 보세요</h1>
            <p class="lead">순서와 세부 시간은 다음 단계에서 편하게 조절할 수 있습니다.</p>
            ${catalog
              .map(
                (c, i) => `
              <div class="move-card">
                <div>
                  <strong>${c.name}</strong>
                  <div style="margin-top:4px;">
                    <span class="spring-pill spring-red">${c.springs}</span>
                    <small style="color:#56685f;margin-left:6px;">기본 ${c.min}분</small>
                  </div>
                </div>
                <button class="btn" onclick="state.items.push({name:'${c.name}',springs:'${c.springs}',min:${c.min}});render()">+ 담기</button>
              </div>
            `,
              )
              .join('')}
            <div class="cta-bar">
              <button class="btn" onclick="goStep(1)">← 수업 조건</button>
              <button class="btn btn-primary" onclick="goStep(3)">다음: 순서·시간 맞추기 (${state.items.length}개 · ${totalMin}분) →</button>
            </div>
          `;
          return;
        }
        if (state.step === 3) {
          el.innerHTML = `
            <span class="step-kicker">3 / 4 단계 · 순서와 시간 다듬기</span>
            <h1>현재 ${totalMin}분 / 목표 ${state.minutes}분</h1>
            <p class="lead">카드에서 바로 30초(0.5분) 단위로 시간을 맞추거나 순서를 바꾸세요.</p>
            ${state.items
              .map(
                (it, idx) => `
              <div class="move-card">
                <div>
                  <strong>0${idx + 1}. ${it.name}</strong>
                  <div style="margin-top:4px;"><span class="spring-pill spring-blue">${it.springs}</span></div>
                </div>
                <div class="stepper-inline">
                  <button onclick="state.items[${idx}].min=Math.max(1,state.items[${idx}].min-0.5);render()" aria-label="-0.5분">-0.5</button>
                  <strong>${it.min}분</strong>
                  <button onclick="state.items[${idx}].min+=0.5;render()" aria-label="+0.5분">+0.5</button>
                </div>
              </div>
            `,
              )
              .join('')}
            <div class="cta-bar">
              <button class="btn" onclick="goStep(2)">← 동작 더 담기</button>
              <button class="btn btn-primary" onclick="goStep(4)">저장 후 수업 화면 열기 →</button>
            </div>
          `;
          return;
        }
        const curr = state.items[0] || { name: '풋워크', springs: '빨강×2', min: 8 };
        const nxt = state.items[1] || { name: '마무리 호흡', springs: '파랑×1', min: 5 };
        el.innerHTML = `
          <span class="step-kicker">4 / 4 단계 · 수업 진행 화면</span>
          <h1>01 / 0${state.items.length} · ${curr.name}</h1>
          <div class="timer-box">
            <div style="font-size:0.9rem;opacity:0.85;">${state.apparatus} · ${curr.springs}</div>
            <div class="timer-digits">0${Math.floor(curr.min)}:00</div>
            <div style="font-size:0.95rem;">내쉬는 숨에 갈비뼈를 부드럽게 닫으며 밀어냅니다.</div>
          </div>
          <div class="next-banner">
            <div>
              <small style="color:#1f4d3f;font-weight:700;">다음 동작 미리보기</small>
              <div><strong>${nxt.name}</strong> · <span class="spring-pill spring-red">${nxt.springs}</span></div>
            </div>
            <button class="btn" onclick="goStep(3)">편집으로</button>
          </div>
        `;
      }
      render();
    </script>
  </body>
</html>
