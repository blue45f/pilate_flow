<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pilates Flow — 디자인 시안 3종 비교 및 인터랙티브 프로토타입</title>
  <style>
    :root {
      --bg: #faf8f4;
      --surface: #ffffff;
      --surface-subtle: #f3efe8;
      --surface-warm: #ede7dd;
      --ink: #1d201c;
      --ink-muted: #5c6259;
      --line: #e2ddd3;
      --sage: #355441;
      --sage-soft: #e6efe9;
      --sage-hover: #284232;
      --terracotta: #b8563f;
      --terracotta-soft: #faeae5;
      --blue: #36628a;
      --blue-soft: #e6eff7;
      --amber: #9e6d1a;
      --amber-soft: #fbf3e2;
      --stage-bg: #181b18;
      --stage-card: #222722;
      --stage-ink: #f7f5f0;
      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-sm: 10px;
      --shadow: 0 12px 32px rgba(29, 32, 28, 0.06);
      --font: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    }
    body.high-contrast {
      --bg: #ffffff;
      --surface: #ffffff;
      --surface-subtle: #f0f2f0;
      --ink: #000000;
      --ink-muted: #222222;
      --line: #222222;
      --sage: #0f3d22;
      --stage-bg: #000000;
      --stage-card: #111111;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font);
      background: #efece6;
      color: var(--ink);
      line-height: 1.5;
      word-break: keep-all;
    }
    button, input, select {
      font: inherit;
    }
    button {
      cursor: pointer;
      min-height: 44px;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      transition: background 150ms ease, border-color 150ms ease, transform 120ms ease;
    }
    body.reduced-motion *, body.reduced-motion *::before, body.reduced-motion *::after {
      animation: none !important;
      transition: none !important;
    }
    button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 3px solid var(--sage);
      outline-offset: 2px;
    }
    .proto-header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(250, 248, 244, 0.96);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
      padding: 12px 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .proto-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .proto-brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: var(--sage);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 700;
    }
    .proto-brand h1 {
      margin: 0;
      font-size: 1rem;
    }
    .proto-brand small {
      display: block;
      font-size: 0.76rem;
      color: var(--ink-muted);
    }
    .proto-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .seg-group {
      display: inline-flex;
      background: var(--surface-subtle);
      padding: 3px;
      border-radius: 12px;
      border: 1px solid var(--line);
      gap: 2px;
    }
    .seg-btn {
      min-height: 36px;
      padding: 4px 12px;
      border-radius: 9px;
      background: transparent;
      color: var(--ink-muted);
      font-size: 0.84rem;
      font-weight: 600;
    }
    .seg-btn[aria-pressed="true"] {
      background: var(--surface);
      color: var(--ink);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.07);
    }
    .seg-btn .rec-pill {
      background: var(--sage-soft);
      color: var(--sage);
      font-size: 0.7rem;
      padding: 1px 6px;
      border-radius: 999px;
      margin-left: 4px;
    }
    .proto-banner {
      max-width: 1320px;
      margin: 18px auto 0;
      padding: 0 20px;
    }
    .rationale-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: 14px 18px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .rationale-card strong {
      color: var(--sage);
    }
    .viewport-stage {
      max-width: 1320px;
      margin: 16px auto 48px;
      padding: 0 20px;
      display: flex;
      justify-content: center;
    }
    .device-frame {
      width: 100%;
      max-width: 1280px;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: var(--shadow);
      overflow: hidden;
      transition: max-width 220ms ease;
    }
    .device-frame.is-mobile {
      max-width: 390px;
      border-width: 8px;
      border-color: #262925;
      border-radius: 36px;
    }
    .app-topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .app-nav-tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .nav-tab {
      min-height: 38px;
      padding: 6px 13px;
      background: transparent;
      color: var(--ink-muted);
      font-weight: 600;
      font-size: 0.88rem;
      border-radius: 999px;
    }
    .nav-tab.active {
      background: var(--sage);
      color: #fff;
    }
    .save-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      padding: 5px 10px;
      border-radius: 999px;
      background: var(--sage-soft);
      color: var(--sage);
      font-weight: 600;
    }
    .save-pill.dirty {
      background: var(--amber-soft);
      color: var(--amber);
    }
    .screen-body {
      padding: 24px;
    }
    .device-frame.is-mobile .screen-body {
      padding: 16px;
    }
    /* Home Screen */
    .home-hero-grid {
      display: grid;
      grid-template-columns: 1.25fr 1fr;
      gap: 18px;
    }
    .device-frame.is-mobile .home-hero-grid {
      grid-template-columns: 1fr;
    }
    .hero-new-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 18px;
    }
    .kicker {
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--sage);
    }
    .hero-new-card h2 {
      margin: 6px 0 8px;
      font-size: 1.55rem;
      line-height: 1.3;
    }
    .quick-defaults {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .chip {
      min-height: 38px;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--surface-subtle);
      border: 1px solid var(--line);
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--ink);
    }
    .chip.selected {
      background: var(--sage-soft);
      border-color: var(--sage);
      color: var(--sage);
    }
    .btn-primary {
      background: var(--sage);
      color: #fff;
      padding: 10px 18px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-primary:hover { background: var(--sage-hover); }
    .btn-secondary {
      background: var(--surface);
      color: var(--ink);
      border: 1px solid var(--line);
      padding: 9px 14px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .recent-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .recent-item {
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: var(--bg);
    }
    .recent-item strong { display: block; font-size: 0.96rem; }
    .recent-item span { font-size: 0.82rem; color: var(--ink-muted); }
    /* Editor Split Layout (Option A) */
    .editor-split {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 20px;
      align-items: start;
    }
    .device-frame.is-mobile .editor-split {
      grid-template-columns: 1fr;
    }
    .finder-pane, .sequence-pane {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: 18px;
    }
    .search-input {
      width: 100%;
      min-height: 44px;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--line);
      background: var(--bg);
      margin-bottom: 10px;
    }
    .catalog-list {
      display: grid;
      gap: 10px;
      margin-top: 12px;
    }
    .catalog-card {
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: 10px 12px;
      display: grid;
      grid-template-columns: 64px 1fr auto;
      gap: 10px;
      align-items: center;
      background: var(--bg);
    }
    .motion-thumb {
      width: 64px;
      height: 52px;
      border-radius: 10px;
      background: var(--surface);
      border: 1px solid var(--line);
      display: grid;
      place-items: center;
    }
    .spring-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.74rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
    }
    .spring-red { background: var(--terracotta-soft); color: var(--terracotta); }
    .spring-blue { background: var(--blue-soft); color: var(--blue); }
    .spring-yellow { background: var(--amber-soft); color: var(--amber); }
    .seq-header-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--line);
    }
    .title-input {
      font-size: 1.25rem;
      font-weight: 700;
      border: 1px solid transparent;
      background: transparent;
      padding: 4px 8px;
      border-radius: 8px;
      min-width: 240px;
    }
    .title-input:hover, .title-input:focus {
      border-color: var(--line);
      background: var(--bg);
    }
    .time-meter {
      margin: 14px 0;
      padding: 12px 14px;
      border-radius: var(--radius-md);
      background: var(--surface-subtle);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .progress-track {
      width: 100%;
      height: 8px;
      background: var(--line);
      border-radius: 999px;
      overflow: hidden;
      display: flex;
    }
    .progress-fill-warm { background: #7aa089; }
    .progress-fill-main { background: var(--sage); }
    .progress-fill-cool { background: #9cb4c9; }
    .section-group {
      margin-top: 16px;
    }
    .section-group h4 {
      margin: 0 0 8px;
      font-size: 0.84rem;
      color: var(--ink-muted);
      display: flex;
      justify-content: space-between;
    }
    .step-row {
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: 10px 12px;
      margin-bottom: 8px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: var(--surface);
    }
    .step-row-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 200px;
    }
    .step-num {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--surface-subtle);
      font-size: 0.78rem;
      font-weight: 700;
      display: grid;
      place-items: center;
    }
    .step-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .mini-btn {
      min-height: 36px;
      padding: 4px 9px;
      font-size: 0.8rem;
      background: var(--surface-subtle);
      color: var(--ink);
      border: 1px solid var(--line);
    }
    .ai-drawer {
      margin-top: 14px;
      border: 1px dashed var(--sage);
      background: var(--sage-soft);
      border-radius: var(--radius-md);
      padding: 14px;
    }
    /* Wizard (Option B) */
    .wizard-box {
      max-width: 640px;
      margin: 0 auto;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: 28px;
    }
    .wizard-steps {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    .wizard-dot {
      flex: 1;
      padding: 8px;
      border-radius: 10px;
      text-align: center;
      font-size: 0.82rem;
      background: var(--surface-subtle);
      color: var(--ink-muted);
      font-weight: 600;
    }
    .wizard-dot.active {
      background: var(--sage);
      color: #fff;
    }
    /* Timeline (Option C) */
    .timeline-board {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: 20px;
    }
    .ribbon-track {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 12px 0;
    }
    .ribbon-block {
      min-width: 110px;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--line);
      flex-shrink: 0;
    }
    /* Live Stage Screen */
    .live-stage {
      background: var(--stage-bg);
      color: var(--stage-ink);
      border-radius: var(--radius-lg);
      padding: 24px;
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      gap: 20px;
    }
    .device-frame.is-mobile .live-stage {
      grid-template-columns: 1fr;
      padding: 16px;
    }
    .stage-main-card, .stage-next-card {
      background: var(--stage-card);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: var(--radius-lg);
      padding: 22px;
    }
    .giant-timer {
      font-size: 4.4rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
      line-height: 1.05;
      margin: 10px 0;
    }
    .device-frame.is-mobile .giant-timer {
      font-size: 3.4rem;
    }
    .stage-undo-bar {
      background: rgba(251, 243, 226, 0.14);
      border: 1px solid rgba(251, 243, 226, 0.35);
      border-radius: 12px;
      padding: 10px 14px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 0.86rem;
    }
    @keyframes carriageGlide {
      0%, 100% { transform: translateX(0px); }
      50% { transform: translateX(12px); }
    }
    .anim-carriage {
      animation: carriageGlide 3.2s ease-in-out infinite;
    }
  </style>
</head>
<body>
  <header class="proto-header" aria-label="시안 비교 컨트롤 바">
    <div class="proto-brand">
      <span class="proto-brand-mark">PF</span>
      <div>
        <h1>Pilates Flow 디자인 시안 비교 프로토타입</h1>
        <small>홈 · 시퀀스 편집 · 수업 진행 · 재사용 (데스크톱 & 모바일 실시간 전환)</small>
      </div>
    </div>
    <div class="proto-controls">
      <div class="seg-group" role="group" aria-label="디자인 시안 선택">
        <button type="button" class="seg-btn" data-opt="A" aria-pressed="true" onclick="setOption('A')">
          시안 A · 원스크린 워크벤치 <span class="rec-pill">추천</span>
        </button>
        <button type="button" class="seg-btn" data-opt="B" aria-pressed="false" onclick="setOption('B')">
          시안 B · 단계형 위저드
        </button>
        <button type="button" class="seg-btn" data-opt="C" aria-pressed="false" onclick="setOption('C')">
          시안 C · 타임라인 리본
        </button>
      </div>
      <div class="seg-group" role="group" aria-label="화면 크기 선택">
        <button type="button" class="seg-btn" data-vp="desktop" aria-pressed="true" onclick="setViewport('desktop')">데스크톱 1280px</button>
        <button type="button" class="seg-btn" data-vp="mobile" aria-pressed="false" onclick="setViewport('mobile')">모바일 390px</button>
      </div>
      <button type="button" class="mini-btn" onclick="document.body.classList.toggle('high-contrast')">고대비</button>
      <button type="button" class="mini-btn" onclick="document.body.classList.toggle('reduced-motion')">모션 감소</button>
    </div>
  </header>

  <section class="proto-banner">
    <div class="rationale-card" id="option-rationale"></div>
  </section>

  <main class="viewport-stage">
    <div class="device-frame" id="device-frame">
      <div class="app-topbar">
        <div style="display:flex;align-items:center;gap:10px;">
          <strong style="font-size:1.02rem;">Pilates Flow</strong>
          <span class="save-pill" id="save-badge">● 이 기기에 저장됨</span>
        </div>
        <nav class="app-nav-tabs" aria-label="핵심 화면 전환">
          <button type="button" class="nav-tab active" data-scr="home" onclick="setScreen('home')">1. 홈 · 새 수업</button>
          <button type="button" class="nav-tab" data-scr="edit" onclick="setScreen('edit')">2. 시퀀스 편집</button>
          <button type="button" class="nav-tab" data-scr="teach" onclick="setScreen('teach')">3. 수업 진행</button>
          <button type="button" class="nav-tab" data-scr="saved" onclick="setScreen('saved')">4. 보관 · 복제</button>
        </nav>
      </div>
      <div class="screen-body" id="screen-root"></div>
    </div>
  </main>

  <script>
    const state = {
      option: 'A',
      viewport: 'desktop',
      screen: 'home',
      title: '오전 리포머 코어 & 정렬 50분',
      targetMin: 50,
      apparatus: '리포머',
      level: '초중급',
      saved: true,
      aiOpen: false,
      wizardStep: 1,
      timerRunning: false,
      timerSec: 200,
      currentIdx: 0,
      undoBanner: null,
      steps: [
        { id: 's1', section: '준비', name: '리포머 풋워크', en: 'Footwork', min: 5, reps: 10, springs: '빨강×2 파랑×1', springType: 'red', cue: '내쉬는 숨에 발바닥 아치로 밀어내며 골반 중립을 유지하세요.' },
        { id: 's2', section: '준비', name: '펠빅 컬', en: 'Pelvic Curl', min: 5, reps: 8, springs: '빨강×2', springType: 'red', cue: '꼬리뼈부터 순차적으로 척추를 말아 올립니다.' },
        { id: 's3', section: '본운동', name: '헌드레드', en: 'The Hundred', min: 6, reps: 10, springs: '빨강×1 파랑×1', springType: 'blue', cue: '턱 끝을 가볍게 당기고 5번 마시고 5번 내쉬며 팔을 펌핑합니다.' },
        { id: 's4', section: '본운동', name: '롱박스 스완', en: 'Long Box Swan', min: 7, reps: 6, springs: '파랑×1', springType: 'blue', cue: '어깨를 귀에서 멀리 낮추며 흉추 위쪽부터 길게 젖혀 올립니다.' },
        { id: 's5', section: '마무리', name: '핏 인 스트랩 서클', en: 'Feet in Straps', min: 6, reps: 8, springs: '빨강×1 파랑×1', springType: 'red', cue: '천골이 뜨지 않는 범위에서 고관절을 부드럽게 회전합니다.' },
        { id: 's6', section: '마무리', name: '머메이드 스트레치', en: 'Mermaid', min: 5, reps: 5, springs: '파랑×1', springType: 'yellow', cue: '양쪽 좌골을 매트에 내리고 옆구리를 길게 열어 호흡합니다.' }
      ],
      catalog: [
        { name: '암 서클 (Arm Circles)', section: '준비', min: 4, reps: 8, springs: '빨강×1 파랑×1', springType: 'blue', cue: '갈비뼈가 들리지 않도록 복부를 연결한 채 팔로 원을 그립니다.' },
        { name: '스쿠터 (Scooter)', section: '본운동', min: 6, reps: 10, springs: '빨강×1', springType: 'red', cue: '지지하는 다리의 둔근을 고정하고 캐리지를 일정한 속도로 밀어냅니다.' },

      B: '<strong>[비교안 · 시안 B: 단계형 가이드 위저드]</strong> 1단계(기본 설정) → 2단계(동작 선택) → 3단계(순서·시간)로 한 번에 한 질문만 보여줘 초보자에게 친숙하지만, 편집 중 동작을 추가하거나 시간을 고칠 때 화면을 왕복해야 해 반복 사용 시 클릭 수가 늘어납니다.',

    };

    function miniMotionSvg(kind) {
      return `<svg width="54" height="42" viewBox="0 0 64 48" fill="none" aria-hidden="true">
        <line x1="6" y1="39" x2="58" y2="39" stroke="#5c6259" stroke-width="2" stroke-linecap="round"/>
        <g class="anim-carriage">
          <rect x="14" y="33" width="26" height="4" rx="2" fill="#355441"/>
          <circle cx="20" cy="24" r="3.5" stroke="#1d201c" stroke-width="1.8"/>
          <path d="${kind === '본운동' ? 'M23 26 Q31 20 39 24 L48 16' : 'M23 27 Q31 22 39 30 L47 22'}" stroke="#1d201c" stroke-width="2" stroke-linecap="round"/>
        </g>
        <line x1="52" y1="26" x2="55" y2="39" stroke="#b8563f" stroke-width="2.2" stroke-linecap="round"/>
      </svg>`;
    }

    function totalMinutes() {
      return state.steps.reduce((acc, item) => acc + item.min, 0);
    }

    function setOption(opt) {
      state.option = opt;
      document.querySelectorAll('[data-opt]').forEach((btn) => {
        btn.setAttribute('aria-pressed', String(btn.dataset.opt === opt));
      });
      render();
    }

    function setViewport(vp) {
      state.viewport = vp;
      document.querySelectorAll('[data-vp]').forEach((btn) => {
        btn.setAttribute('aria-pressed', String(btn.dataset.vp === vp));
      });
      document.getElementById('device-frame').classList.toggle('is-mobile', vp === 'mobile');
    }

    function setScreen(scr) {
      state.screen = scr;
      document.querySelectorAll('[data-scr]').forEach((btn) => {
        btn.classList.toggle('active', btn.dataset.scr === scr);
      });
      render();
    }

    function addMove(idx) {
      const item = state.catalog[idx];
      state.steps.push({
        id: 's' + Date.now(),
        section: item.section,
        name: item.name.split(' (')[0],
        en: item.name,
        min: item.min,
        reps: item.reps,
        springs: item.springs,
        springType: item.springType,
        cue: item.cue
      });
      state.saved = false;
      render();
    }

    function adjustTime(idx, delta) {
      const next = Math.max(1, Math.min(20, state.steps[idx].min + delta));
      state.steps[idx].min = Math.round(next * 2) / 2;
      state.saved = false;
      render();
    }

    function moveStep(idx, dir) {
      const target = idx + dir;
      if (target < 0 || target >= state.steps.length) return;
      const copy = [...state.steps];
      [copy[idx], copy[target]] = [copy[target], copy[idx]];
      state.steps = copy;
      state.saved = false;
      render();
    }

    function removeStep(idx) {
      state.steps.splice(idx, 1);
      state.saved = false;
      render();
    }

    function autoFit() {
      if (!state.steps.length) return;
      const diff = state.targetMin - totalMinutes();
      const each = diff / state.steps.length;
      state.steps.forEach((s) => {
        s.min = Math.max(1, Math.round((s.min + each) * 2) / 2);
      });
      state.saved = false;
      render();
    }

    function applyAiSuggestion() {
      state.steps.push(
        { id: 'ai1', section: '본운동', name: '쇼트박스 라운드 백', en: 'Short Box Round', min: 8, reps: 8, springs: '빨강×2', springType: 'red', cue: '골반 아래부터 동그랗게 말아 복부 깊은 곳의 지지를 유지합니다.' },
        { id: 'ai2', section: '마무리', name: '니 호버 호흡 정리', en: 'Knee Hover', min: 8, reps: 6, springs: '빨강×1 파랑×1', springType: 'blue', cue: '무릎을 2cm만 띄워 견갑과 코어의 연결을 차분히 마무리합니다.' }
      );
      state.aiOpen = false;
      state.saved = false;
      render();
    }

    function jumpStage(nextIdx) {
      if (nextIdx < 0 || nextIdx >= state.steps.length) return;
      state.undoBanner = { fromIdx: state.currentIdx, fromName: state.steps[state.currentIdx].name };
      state.currentIdx = nextIdx;
      state.timerSec = Math.round(state.steps[nextIdx].min * 60);
      render();
    }

    function undoStageJump() {
      if (!state.undoBanner) return;
      state.currentIdx = state.undoBanner.fromIdx;
      state.timerSec = Math.round(state.steps[state.currentIdx].min * 60);
      state.undoBanner = null;
      render();
    }

      const ss = String(state.timerSec % 60).padStart(2, '0');
      return `
        <div class="live-stage">
          <section class="stage-main-card" aria-label="현재 진행 동작">
            ${state.undoBanner ? `
              <div class="stage-undo-bar" role="status">
                <span>실수로 넘겼나요? 직전 <strong>${state.undoBanner.fromName}</strong> 위치로 바로 돌아갈 수 있어요.</span>
                <button type="button" class="mini-btn" onclick="undoStageJump()">↩ 방금 이동 되돌리기</button>
              </div>
            ` : ''}
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <span style="color:#a7c4b2;font-weight:700;">현재 동작 ${state.currentIdx + 1} / ${state.steps.length} · ${cur.section}</span>
              <span class="spring-pill spring-${cur.springType}">${cur.springs} · ${cur.reps}회</span>
            </div>
            <h2 style="font-size:2rem;margin:10px 0 4px;">${cur.name} <small style="font-weight:400;opacity:0.7;font-size:1rem;">${cur.en}</small></h2>
            <div class="giant-timer">${mm}:${ss}</div>
            <p style="font-size:1.05rem;color:#e3e8e4;margin:0 0 18px;">💡 “${cur.cue}”</p>
            <div style="display:flex;gap:10px;flex-wrap:wrap;">
              <button type="button" class="btn-secondary" onclick="jumpStage(${state.currentIdx - 1})" ${state.currentIdx === 0 ? 'disabled' : ''}>← 이전</button>
              <button type="button" class="btn-primary" style="flex:1;font-size:1.05rem;" onclick="toggleStageTimer()">
                ${state.timerRunning ? '⏸ 일시정지' : '▶ 타이머 시작'}
              </button>
              <button type="button" class="btn-secondary" onclick="state.timerSec+=60;render()">+1분 추가</button>
              <button type="button" class="btn-secondary" onclick="jumpStage(${state.currentIdx + 1})" ${!next ? 'disabled' : ''}>다음 →</button>
            </div>
          </section>

          <aside class="stage-next-card" aria-label="다음 동작 및 기구 세팅 예고">
            <span style="font-size:0.8rem;color:#a7c4b2;font-weight:700;">NEXT UP · 미리 준비할 세팅</span>
            ${next ? `
              <h3 style="font-size:1.45rem;margin:8px 0 6px;">다음: ${next.name}</h3>
              <p style="margin:0 0 12px;"><span class="spring-pill spring-${next.springType}">스프링: ${next.springs}</span> · ${next.min}분</p>
              <p style="opacity:0.82;font-size:0.9rem;">핵심 큐: ${next.cue}</p>
            ` : `<h3 style="margin:10px 0;">마지막 동작입니다 🎉</h3><p style="opacity:0.8;">마무리 후 수업을 종료하고 기록을 남기세요.</p>`}
            <hr style="border:none;border-top:1px solid rgba(255,255,255,0.12);margin:16px 0;"/>
            <strong style="font-size:0.85rem;display:block;margin-bottom:8px;">전체 순서 빠른 이동</strong>
            <div style="display:grid;gap:6px;">
              ${state.steps.map((s, idx) => `
                <button type="button" class="mini-btn" style="justify-content:space-between;display:flex;background:${idx === state.currentIdx ? '#355441' : 'rgba(255,255,255,0.06)'};color:#fff;border-color:transparent;" onclick="jumpStage(${idx})">
                  <span>${idx + 1}. ${s.name}</span><span>${s.min}분</span>
                </button>
              `).join('')}
            </div>
          </aside>
        </div>
      `;
    }

    function renderSaved() {
      return `
        <div style="display:grid;gap:14px;">
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
            <div>
              <span class="kicker">보관함 · 원클릭 복제 & 재사용</span>
              <h2 style="margin:4px 0 0;">저장한 수업 시퀀스</h2>
            </div>
            <button type="button" class="btn-primary" onclick="setScreen('edit')">+ 새 수업 만들기</button>
          </div>
          <div class="recent-item" style="background:var(--surface);padding:18px;">
            <div>
              <strong style="font-size:1.08rem;">${state.title}</strong>
              <span>리포머 · Lv 1.5 · ${state.steps.length}개 동작 (${totalMinutes()}분) · 최근 수업 2회</span>
            </div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
              <button type="button" class="btn-secondary" onclick="setScreen('edit')">편집하기</button>
              <button type="button" class="btn-secondary" onclick="state.title=state.title+' (복제본)';state.saved=false;setScreen('edit')">사본 복제</button>
              <button type="button" class="btn-primary" onclick="setScreen('teach')">▶ 바로 수업 시작</button>
            </div>
          </div>
        </div>
      `;
    }

    let intervalId = null;
    function toggleStageTimer() {
      state.timerRunning = !state.timerRunning;
      if (state.timerRunning) {
        intervalId = setInterval(() => {
          if (state.timerSec > 0) {
            state.timerSec -= 1;
            render();
          } else {
            state.timerRunning = false;
            clearInterval(intervalId);
            render();
          }
        }, 1000);
      } else {
        clearInterval(intervalId);
      }
      render();
    }

    function updateSaveBadge() {
      const badge = document.getElementById('save-badge');
      badge.textContent = state.saved ? '● 이 기기에 저장됨' : '● 변경사항 있음 (자동 임시보관)';
      badge.classList.toggle('dirty', !state.saved);
    }

    function render() {
      document.getElementById('option-rationale').innerHTML = rationales[state.option];
      updateSaveBadge();
      const root = document.getElementById('screen-root');
      if (state.screen === 'home') root.innerHTML = renderHome();
      else if (state.screen === 'edit') {
        root.innerHTML = state.option === 'A' ? renderEditorA() : state.option === 'B' ? renderEditorB() : renderEditorC();
      } else if (state.screen === 'teach') root.innerHTML = renderTeach();
      else root.innerHTML = renderSaved();
    }

    render();
  </script>
</body>
</html>
