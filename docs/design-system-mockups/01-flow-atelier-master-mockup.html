<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flow Atelier — 전 화면 통합 마스터 디자인 시안 (v2.2)</title>
  <style>
    :root {
      --bg: #faf8f4;
      --surface: #ffffff;
      --surface-subtle: #f3efe8;
      --surface-warm: #ede7dd;
      --ink: #1d201c;
      --ink-secondary: #4f564d;
      --ink-muted: #5c6259;
      --line: #e2ddd3;
      --sage-deep: #1f4d3f;
      --sage: #355441;
      --sage-soft: #e6efe9;
      --sage-border: #bfd3c6;
      --champagne: #b88a55;
      --terracotta: #b8563f;
      --terracotta-soft: #faeae5;
      --blue: #36628a;
      --blue-soft: #e6eff7;
      --amber: #9e6d1a;
      --amber-soft: #fbf3e2;
      --stage-bg: #181b18;
      --stage-card: #222722;
      --stage-elevated: #2a302a;
      --stage-ink: #f7f5f0;
      --stage-mint: #a7c4b2;
      --radius-xl: 24px;
      --radius-lg: 18px;
      --radius-md: 14px;
      --radius-sm: 10px;
      --shadow-soft: 0 8px 28px rgba(29, 32, 28, 0.05), 0 1px 4px rgba(29, 32, 28, 0.03);
      --font: "Pretendard Variable", "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    }
    body.high-contrast {
      --bg: #ffffff;
      --surface: #ffffff;
      --surface-subtle: #eef1ee;
      --ink: #000000;
      --ink-secondary: #111111;
      --ink-muted: #1e1e1e;
      --line: #1d201c;
      --sage: #0f3d22;
      --sage-deep: #092916;
      --stage-bg: #000000;
      --stage-card: #0f1310;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font);
      background: #ece8e0;
      color: var(--ink);
      line-height: 1.5;
      letter-spacing: -0.015em;
      word-break: keep-all;
    }
    button, input, select { font: inherit; }
    button {
      min-height: 44px;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      cursor: pointer;
      transition: background 140ms ease, border-color 140ms ease, transform 120ms ease;
    }
    body.reduced-motion *, body.reduced-motion *::before, body.reduced-motion *::after {
      animation: none !important;
      transition: none !important;
    }
    button:focus-visible, input:focus-visible {
      outline: 3px solid var(--sage-deep);
      outline-offset: 2px;
    }

    /* Prototype Spec Header */
    .spec-bar {
      position: sticky;
      top: 0;
      z-index: 60;
      background: rgba(250, 248, 244, 0.96);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
      padding: 10px 22px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .spec-title { display: flex; align-items: center; gap: 10px; }
    .spec-badge {
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--sage-deep);
      color: #fff;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.06em;
    }
    .spec-controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .seg-bar {
      display: inline-flex;
      gap: 3px;
      padding: 3px;
      background: var(--surface-subtle);
      border: 1px solid var(--line);
      border-radius: 999px;
    }
    .seg-pill {
      min-height: 36px;
      padding: 4px 13px;
      border-radius: 999px;
      background: transparent;
      color: var(--ink-muted);
      font-size: 0.8rem;
      font-weight: 700;
    }
    .seg-pill[aria-pressed="true"] {
      background: var(--surface);
      color: var(--ink);
      box-shadow: 0 2px 6px rgba(29, 32, 28, 0.08);
    }

    /* Viewport Frame */
    .stage-wrap {
      max-width: 1460px;
      margin: 18px auto 48px;
      padding: 0 18px;
      display: flex;
      justify-content: center;
    }
    .app-frame {
      width: 100%;
      max-width: 1400px;
      min-height: 820px;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 26px;
      box-shadow: 0 20px 56px rgba(29, 32, 28, 0.1);
      overflow: hidden;
      display: grid;
      grid-template-columns: 224px minmax(0, 1fr);
      transition: max-width 200ms ease;
    }
    .app-frame.is-mobile {
      max-width: 390px;
      grid-template-columns: 1fr;
      border: 8px solid #232824;
      border-radius: 38px;
    }

    /* Light Editorial Sidebar */
    .atelier-sidebar {
      background: var(--surface);
      border-right: 1px solid var(--line);
      padding: 22px 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .app-frame.is-mobile .atelier-sidebar { display: none; }
    .brand-lockup {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 2px 6px 20px;
    }
    .brand-icon {
      width: 36px;
      height: 36px;
      border-radius: 11px;
      background: var(--sage);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 800;
      box-shadow: 0 4px 12px rgba(53, 84, 65, 0.22);
    }
    .brand-lockup strong { display: block; font-size: 1.12rem; letter-spacing: -0.03em; }
    .brand-lockup small { display: block; font-size: 0.58rem; letter-spacing: 0.12em; color: #767d72; font-weight: 700; }
    .nav-label { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.12em; color: #8a8f85; margin: 4px 8px; }
    .side-nav-btn {
      width: 100%;
      min-height: 46px;
      padding: 0 12px;
      border-radius: 12px;
      background: transparent;
      color: var(--ink-secondary);
      font-size: 0.9rem;
      font-weight: 650;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-align: left;
    }
    .side-nav-btn:hover { background: #f5f2eb; color: var(--ink); }
    .side-nav-btn.active {
      background: var(--sage-soft);
      color: var(--sage-deep);
      border-color: var(--sage-border);
      font-weight: 750;
    }
    .side-count {
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--surface-subtle);
      font-size: 0.72rem;
      font-weight: 700;
    }
    .upcoming-box {
      margin-top: auto;
      padding-top: 16px;
      border-top: 1px solid #ebe6dc;
      display: grid;
      gap: 8px;
    }
    .upcoming-card {
      padding: 10px 12px;
      border-radius: 12px;
      background: var(--bg);
      border: 1px solid var(--line);
      font-size: 0.8rem;
    }
    .upcoming-card strong { color: var(--sage-deep); display: block; }

    /* Workspace Column */
    .atelier-workspace {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .atelier-topbar {
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
      min-height: 62px;
      padding: 10px 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .app-frame.is-mobile .atelier-topbar { padding: 10px 14px; }
    .breadcrumb { font-size: 0.86rem; font-weight: 650; color: var(--ink-muted); }
    .local-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 11px;
      border-radius: 999px;
      background: var(--sage-soft);
      border: 1px solid var(--sage-border);
      color: var(--sage-deep);
      font-size: 0.75rem;
      font-weight: 700;
    }
    .workspace-body {
      padding: 24px 28px 40px;
      flex: 1;
    }
    .app-frame.is-mobile .workspace-body { padding: 16px 14px 82px; }

    /* Journey Bar & Headings */
    .journey-ribbon {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      padding: 8px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      margin-bottom: 18px;
      box-shadow: var(--shadow-soft);
    }
    .app-frame.is-mobile .journey-ribbon { grid-template-columns: repeat(2, 1fr); }
    .journey-btn {
      min-height: 46px;
      padding: 7px 11px;
      border-radius: 11px;
      background: transparent;
      color: var(--ink-muted);
      text-align: left;
      font-size: 0.8rem;
    }
    .journey-btn strong { display: block; font-size: 0.84rem; color: var(--ink); }
    .journey-btn.active { background: var(--sage-deep); color: rgba(255,255,255,0.84); }
    .journey-btn.active strong { color: #fff; }

    /* Cards, Buttons, Pills */
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-xl);
      padding: 24px;
      box-shadow: var(--shadow-soft);
    }
    .app-frame.is-mobile .card { padding: 18px 15px; border-radius: 18px; }
    .kicker {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 11px;
      border-radius: 999px;
      background: var(--surface-subtle);
      color: var(--sage-deep);
      font-size: 0.74rem;
      font-weight: 750;
    }
    .btn-primary {
      background: var(--sage);
      border-color: var(--sage);
      color: #fff;
      padding: 10px 18px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }
    .btn-primary:hover { background: var(--sage-deep); }
    .btn-secondary {
      background: var(--surface);
      border-color: var(--line);
      color: var(--ink);
      padding: 9px 15px;
      font-weight: 650;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-secondary:hover { background: #f5f2eb; }
    .chip {
      min-height: 40px;
      padding: 6px 14px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--line);
      font-size: 0.84rem;
      font-weight: 700;
      color: var(--ink);
    }
    .chip.selected { background: var(--sage-deep); border-color: var(--sage-deep); color: #fff; }
    .spring-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 9px;
      border-radius: 999px;
      font-size: 0.73rem;
      font-weight: 700;
    }
    .spring-red { background: var(--terracotta-soft); color: var(--terracotta); }
    .spring-blue { background: var(--blue-soft); color: var(--blue); }
    .spring-yellow { background: var(--amber-soft); color: var(--amber); }

    /* Grids */
    .two-col { display: grid; grid-template-columns: 1.2fr 1fr; gap: 18px; }
    .split-workbench { display: grid; grid-template-columns: 350px minmax(0, 1fr); gap: 18px; align-items: start; }
    .three-col { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
    .atlas-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
    .schedule-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
    .app-frame.is-mobile .two-col,
    .app-frame.is-mobile .split-workbench,
    .app-frame.is-mobile .three-col,
    .app-frame.is-mobile .atlas-grid,
    .app-frame.is-mobile .schedule-grid { grid-template-columns: 1fr; }

    .step-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--surface);
      margin-bottom: 8px;
    }
    .motion-thumb {
      width: 84px;
      height: 54px;
      border-radius: 10px;
      border: 1px solid #dcd4c3;
      overflow: hidden;
      background: linear-gradient(180deg, #fdfcf8 0%, #efe9dc 100%);
      flex-shrink: 0;
    }

    /* Dark Live Stage */
    .dark-stage {
      background: var(--stage-bg);
      color: var(--stage-ink);
      border-radius: var(--radius-xl);
      padding: 24px;
      display: grid;
      grid-template-columns: 1.55fr 1fr;
      gap: 18px;
    }
    .app-frame.is-mobile .dark-stage { grid-template-columns: 1fr; padding: 16px; }
    .stage-panel {
      background: var(--stage-card);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 22px;
    }
    .stage-timer {
      font-size: clamp(3.4rem, 7vw, 5rem);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.03em;
      line-height: 1.05;
      margin: 8px 0;
    }

    /* Mobile Bottom Nav */
    .mobile-bottom-nav {
      display: none;
    }
    .app-frame.is-mobile .mobile-bottom-nav {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
      padding: 6px 8px;
      background: rgba(255, 255, 255, 0.96);
      border-top: 1px solid var(--line);
      position: sticky;
      bottom: 0;
    }
    .mobile-bottom-nav button {
      min-height: 48px;
      font-size: 0.72rem;
      font-weight: 700;
      background: transparent;
      color: var(--ink-muted);
    }
    .mobile-bottom-nav button.active {
      background: var(--sage-soft);
      color: var(--sage-deep);
    }

    @keyframes gentleFloat {
      0%, 100% { transform: translateX(0px); }
      50% { transform: translateX(7px); }
    }
    .studio-glide { animation: gentleFloat 3.6s ease-in-out infinite; }
  </style>
</head>
<body>
  <header class="spec-bar" aria-label="마스터 디자인 시안 제어바">
    <div class="spec-title">
      <span class="spec-badge">MASTER DESIGN SPEC v2.2</span>
      <div>
        <strong style="font-size:0.95rem;">Flow Atelier 통합 마스터 디자인 시안 (실제 앱 1:1 매핑)</strong>
        <div style="font-size:0.76rem;color:var(--ink-muted);">라이트 에디토리얼 셸 · 4모드 워크벤치 · 98종 스튜디오 기구학 모션 · 다크 라이브 스테이지 · 회원 예약</div>
      </div>
    </div>
    <div class="spec-controls">
      <div class="seg-bar" role="group" aria-label="화면 선택">
        <button class="seg-pill" data-scr="home" aria-pressed="true" onclick="setScreen('home')">1. 홈</button>
        <button class="seg-pill" data-scr="workbench" aria-pressed="false" onclick="setScreen('workbench')">2. 시퀀스 편집</button>
        <button class="seg-pill" data-scr="atlas" aria-pressed="false" onclick="setScreen('atlas')">3. 동작 도감</button>
        <button class="seg-pill" data-scr="stage" aria-pressed="false" onclick="setScreen('stage')">4. 수업 진행</button>
        <button class="seg-pill" data-scr="binder" aria-pressed="false" onclick="setScreen('binder')">5. 보관·기록</button>
        <button class="seg-pill" data-scr="schedule" aria-pressed="false" onclick="setScreen('schedule')">6. 주간 일정</button>
        <button class="seg-pill" data-scr="member" aria-pressed="false" onclick="setScreen('member')">7. 회원 예약</button>
      </div>
      <div class="seg-bar" role="group" aria-label="뷰포트 전환">
        <button class="seg-pill" data-vp="desktop" aria-pressed="true" onclick="setVp('desktop')">데스크톱</button>
        <button class="seg-pill" data-vp="mobile" aria-pressed="false" onclick="setVp('mobile')">모바일 390px</button>
      </div>
      <button class="btn-secondary" style="min-height:36px;padding:4px 10px;font-size:0.78rem;" onclick="document.body.classList.toggle('high-contrast')">고대비</button>
      <button class="btn-secondary" style="min-height:36px;padding:4px 10px;font-size:0.78rem;" onclick="document.body.classList.toggle('reduced-motion')">모션 감소</button>
    </div>
  </header>

  <div class="stage-wrap">
    <div class="app-frame" id="app-frame">
      <aside class="atelier-sidebar" aria-label="스튜디오 사이드바">
        <div class="brand-lockup">
          <div class="brand-icon">FA</div>
          <div>
            <strong>Flow Atelier</strong>
            <small>PILATES CLASS PLANNER</small>
          </div>
        </div>
        <div class="nav-label">MY STUDIO</div>
        <button class="side-nav-btn active" data-nav="workbench" onclick="setScreen('workbench')"><span>오늘의 수업</span></button>
        <button class="side-nav-btn" data-nav="atlas" onclick="setScreen('atlas')"><span>동작 라이브러리</span><span class="side-count">98</span></button>
        <button class="side-nav-btn" data-nav="schedule" onclick="setScreen('schedule')"><span>강사 일정</span></button>
        <button class="side-nav-btn" data-nav="binder" onclick="setScreen('binder')"><span>저장한 플로우</span></button>
        <button class="side-nav-btn" data-nav="member" onclick="setScreen('member')"><span>회원 예약 화면</span></button>

        <div class="upcoming-box">
          <div class="nav-label" style="margin:0;">다가오는 수업</div>
          <div class="upcoming-card">
            <strong>10:00 · 리포머 코어 정렬</strong>
            <span style="color:var(--ink-muted);">본점 A룸 · 오늘</span>
          </div>
          <div class="upcoming-card">
            <strong>19:00 · 체어 하체 밸런스</strong>
            <span style="color:var(--ink-muted);">본점 B룸 · 오늘</span>
          </div>
        </div>
      </aside>

      <div class="atelier-workspace">
        <header class="atelier-topbar">
          <div class="breadcrumb" id="crumb-label">나의 스튜디오 / 오늘의 수업</div>
          <div style="display:flex;align-items:center;gap:8px;">
            <div class="seg-bar">
              <button class="seg-pill" id="role-inst" aria-pressed="true" onclick="setScreen('workbench')">강사 작업실</button>
              <button class="seg-pill" id="role-mem" aria-pressed="false" onclick="setScreen('member')">회원 예약</button>
            </div>
            <span class="local-pill">● 개인 작업 공간</span>
          </div>
        </header>

        <main class="workspace-body" id="workspace-root"></main>

        <nav class="mobile-bottom-nav" aria-label="모바일 하단 탭">
          <button onclick="setScreen('home')" data-mnav="home" class="active">홈</button>
          <button onclick="setScreen('workbench')" data-mnav="workbench">수업</button>
          <button onclick="setScreen('atlas')" data-mnav="atlas">동작</button>
          <button onclick="setScreen('schedule')" data-mnav="schedule">일정</button>
          <button onclick="setScreen('binder')" data-mnav="binder">보관</button>
        </nav>
      </div>
    </div>
  </div>

  <script>
    const state = {
      screen: 'home',
      vp: 'desktop',
      wbMode: 'split', // split | list | columns | timeline
      apparatus: '리포머',
      targetMin: 50,
      title: '오전 리포머 코어 & 척추 분절 50분',
      gapOpen: false,
      steps: [
        { sec: '준비', name: '리포머 풋워크 패럴렐', springs: '2R 1B', sType: 'red', min: 8, pose: 'footwork', cue: '골반과 요추 중립을 유지한 채 뒤꿈치로 풋바를 수평으로 밀어냅니다.' },
        { sec: '준비', name: '펠빅 컬 · 브릿징', springs: '2R', sType: 'red', min: 7, pose: 'bridge', cue: '꼬리뼈부터 척추를 하나씩 분절해 견갑골과 무릎을 사선으로 연결합니다.' },
        { sec: '본운동', name: '헌드레드', springs: '1R 1B', sType: 'blue', min: 8, pose: 'hundred', cue: '날개뼈 하각까지 상체를 말아 올리고 스트랩 장력을 유지하며 팔을 펌핑합니다.' },
        { sec: '본운동', name: '롱박스 스완', springs: '1B', sType: 'blue', min: 9, pose: 'swan', cue: '치골을 박스에 밀착하고 흉추 위쪽부터 길게 앞·위로 젖혀 올립니다.' },
        { sec: '마무리', name: '피트 인 스트랩 서클', springs: '1R 1B', sType: 'red', min: 8, pose: 'straps', cue: '천골이 뜨지 않는 범위에서 고관절 원호를 일정한 길이로 그립니다.' },
        { sec: '마무리', name: '머메이드 사이드 벤드', springs: '1B', sType: 'yellow', min: 6, pose: 'mermaid', cue: '좌골을 고정한 채 옆구리 갈비뼈 사이를 부채처럼 열어 호흡합니다.' }
      ]
    };

    function studioMotionSvg(pose, w = '100%', h = '100%') {
      const uid = pose + Math.random().toString(36).slice(2, 6);
      const commonDefs = `
        <defs>

            <section class="stage-panel">
              <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
                <span style="color:var(--stage-mint);font-weight:700;font-size:0.86rem;">01 / 0${state.steps.length} · ${cur.sec} 구간</span>
                <span class="spring-pill spring-${cur.sType}">${cur.springs} · 리포머</span>
              </div>
              <h1 style="margin:8px 0 10px;font-size:2rem;color:#fff;">${cur.name}</h1>
              <div style="max-width:440px;border-radius:14px;overflow:hidden;margin-bottom:10px;">${studioMotionSvg(cur.pose, '100%', '170')}</div>
              <div class="stage-timer">04:30</div>
              <p style="display:inline-block;padding:5px 12px;border-radius:999px;background:rgba(167,196,178,0.16);color:var(--stage-mint);font-size:0.84rem;font-weight:700;margin:0 0 14px;">호흡 리듬 · 날숨에 밀어내고 들숨에 저항하며 복귀</p>
              <div style="display:grid;grid-template-columns:1fr 1.6fr 1fr;gap:8px;margin-bottom:14px;">
                <button class="btn-secondary" style="background:var(--stage-elevated);color:#fff;border-color:rgba(255,255,255,0.16);">← 이전</button>
                <button class="btn-primary" style="font-size:1.02rem;">⏸ 일시정지</button>
                <button class="btn-secondary" style="background:var(--stage-elevated);color:#fff;border-color:rgba(255,255,255,0.16);">다음 →</button>
              </div>
              <div style="padding:12px 14px;border-radius:14px;background:var(--stage-elevated);border:1px solid rgba(167,196,178,0.28);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
                <div><small style="color:var(--stage-mint);font-weight:700;display:block;">다음 순서 준비 요약</small><strong>${nxt.name}</strong></div>
                <span class="spring-pill spring-${nxt.sType}">스프링 ${nxt.springs}</span>
              </div>
            </section>
            <aside class="stage-panel">
              <span style="color:var(--stage-mint);font-size:0.78rem;font-weight:700;">NEXT UP · 미리 준비할 세팅</span>
              <h2 style="margin:8px 0;color:#fff;">다음: ${nxt.name}</h2>
              <p style="color:rgba(247,245,240,0.82);font-size:0.9rem;">${nxt.cue}</p>
              <hr style="border:none;border-top:1px solid rgba(255,255,255,0.12);margin:16px 0;" />
              <strong style="display:block;margin-bottom:8px;font-size:0.85rem;">오늘의 전체 흐름</strong>
              <div style="display:grid;gap:6px;">
                ${state.steps.map((s, i) => `
                  <div style="padding:9px 12px;border-radius:10px;background:${i === 0 ? 'var(--sage)' : 'rgba(255,255,255,0.06)'};display:flex;justify-content:space-between;font-size:0.85rem;">
                    <span>0${i + 1}. ${s.name}</span><span>${s.min}분</span>
                  </div>
                `).join('')}
              </div>
            </aside>
          </div>
        `;
        return;
      }

      if (state.screen === 'binder') {
        root.innerHTML = journeyHtml + `
          <div class="card">
            <span class="kicker">나의 수업 서랍 · 원탭 복제 & 이력 스냅샷 보존</span>
            <h1 style="margin:8px 0 14px;font-size:1.5rem;">저장한 시퀀스 보관함</h1>
            <div class="step-row" style="padding:18px;">
              <div>
                <strong style="font-size:1.08rem;">${state.title}</strong>
                <div style="font-size:0.84rem;color:var(--ink-muted);margin-top:4px;">리포머 · Lv 1.5 · ${state.steps.length}개 동작 (${sumMin}분) · 최근 수업 2회</div>
              </div>
              <div style="display:flex;gap:8px;flex-wrap:wrap;">
                <button class="btn-primary" onclick="setScreen('workbench')">불러오기</button>
                <button class="btn-secondary" onclick="state.title+=' (복사)';setScreen('workbench')">사본 열기</button>
                <button class="btn-secondary" onclick="setScreen('stage')">▶ 바로 진행</button>
              </div>
            </div>
          </div>
        `;
        return;
      }

      if (state.screen === 'schedule') {
        root.innerHTML = `
          <div class="card">
            <span class="kicker">WEEKLY STUDIO TIMETABLE</span>
            <h1 style="margin:8px 0 14px;font-size:1.5rem;">강사 주간 일정 보드</h1>
            <div class="schedule-grid">
              ${[
                { day: '월 (11/09)', items: ['10:00 리포머 기초 (본점 A)', '19:00 캐딜락 코어 (본점 B)'] },
                { day: '화 (11/10)', items: ['11:00 매트 소도구 (분점)', '20:00 체어 하체 (본점 A)'] },
                { day: '수 (11/11 · 오늘)', items: ['10:00 리포머 코어 정렬', '19:00 체어 하체 밸런스'] },
                { day: '목 (11/12)', items: ['10:00 바렐 척추 신전'] },
                { day: '금 (11/13)', items: ['09:30 리포머 전신 순환', '18:30 금요 릴리즈 스트레치'] }
              ].map((col, idx) => `
                <div style="padding:12px;border-radius:14px;border:1px solid ${idx === 2 ? 'var(--sage-deep)' : 'var(--line)'};background:${idx === 2 ? '#f2f7f4' : '#fcfbf8'};">
                  <strong style="display:block;font-size:0.86rem;margin-bottom:8px;color:${idx === 2 ? 'var(--sage-deep)' : 'var(--ink)'};">${col.day}</strong>
                  ${col.items.map((it) => `<div style="padding:8px 10px;border-radius:10px;background:#fff;border:1px solid var(--line);font-size:0.8rem;margin-bottom:6px;font-weight:600;">${it}</div>`).join('')}
                </div>
              `).join('')}
            </div>
          </div>
        `;
        return;
      }

      // Member Booking & Pass Wallet
      root.innerHTML = `
        <div class="two-col">
          <section style="background:linear-gradient(135deg,#1f4d3f 0%,#355441 64%,#456b54 100%);color:#fffdf8;border-radius:22px;padding:24px;display:flex;justify-content:space-between;align-items:center;gap:16px;">
            <div>
              <span style="color:#ebd3a4;font-size:0.74rem;font-weight:700;letter-spacing:0.08em;">ATELIER MEMBERSHIP PASS</span>
              <h2 style="margin:6px 0 8px;color:#fff;">4:1 기구 필라테스 20회권</h2>
              <div style="font-size:0.88rem;opacity:0.92;">잔여 <strong>14회</strong> / 20회 · 만료일 2026-12-31 · 수업 12시간 전 무료 취소</div>
            </div>
            <div style="width:86px;height:86px;border-radius:50%;border:6px solid #ebd3a4;display:grid;place-items:center;text-align:center;flex-shrink:0;">
              <div><strong style="display:block;font-size:1.15rem;color:#f3dfb8;">14회</strong><small style="font-size:0.68rem;">남음</small></div>
            </div>
          </section>
          <section class="card">
            <span class="kicker">REFORMER SPOT SELECTION</span>
            <h3 style="margin:8px 0 10px;">오늘 19:00 리포머 자리 선택 (본점 A룸)</h3>
            <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;">
              ${['R-01 예약가능', 'R-02 마감', 'R-03 선택됨', 'R-04 예약가능', 'R-05 마감', 'R-06 예약가능'].map((sp, idx) => `
                <button class="btn-secondary" ${sp.includes('마감') ? 'disabled' : ''} style="min-height:64px;flex-direction:column;background:${idx === 2 ? 'var(--sage-soft)' : '#fff'};border-color:${idx === 2 ? 'var(--sage-deep)' : 'var(--line)'};opacity:${sp.includes('마감') ? 0.5 : 1};">
                  <strong>${sp.split(' ')[0]}</strong><small style="font-size:0.72rem;">${sp.split(' ')[1]}</small>
                </button>
              `).join('')}
            </div>
          </section>
        </div>
      `;
    }
    render();
  </script>
</body>
</html>
